<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask RitualEase — RitualEase Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #BA2848;
    --crimson-dark: #961d38;
    --ivory: #FFF8EF;
    --sand: #F8E8D4;
    --gold: #EBAA32;
    --ink: #38272A;
    --ink-muted: #755E62;
    --hairline: #E6D5C3;
    --card-bg: #FFFFFF;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--ivory);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* 1. Top Crimson Accent Bar */
  .top-crimson-bar {
    height: 7px;
    width: 100%;
    background: var(--crimson);
    flex-shrink: 0;
  }

  /* 2. Official RitualEase Intelligence Header (100% Flat Bottom Edge) */
  .brand-header {
    background: var(--ivory);
    padding: 18px 24px 16px 24px;
    text-align: center;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }

  .logo-lockup {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-decoration: none;
  }

  .logo-mark-img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    display: block;
  }

  .logo-text-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }

  .logo-title-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .logo-brand-name {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 800;
    font-size: 1.75rem;
    letter-spacing: -0.025em;
    color: var(--crimson);
    line-height: 1;
  }

  .logo-intelligence {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 1.55rem;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .logo-tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 0.98rem;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  /* 3. Clean Editorial Chat Workspace */
  .workspace-wrap {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 20px 24px 20px;
    display: flex;
    flex-direction: column;
  }

  .workspace-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(56, 39, 42, 0.045);
    display: flex;
    flex-direction: column;
    min-height: 490px;
    overflow: hidden;
  }

  .workspace-bar {
    padding: 15px 24px;
    background: var(--ivory);
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .workspace-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink);
    border: none !important;
    text-decoration: none !important;
    line-height: 1.1;
  }

  .btn-new-chat {
    background: #FFFFFF;
    border: 1px solid #D9C3AD;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-new-chat:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: var(--ivory);
  }

  .chat-stream {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #FFFDFB;
  }

  .entry {
    display: flex;
    flex-direction: column;
  }

  .entry.user {
    align-self: flex-end;
    max-width: 80%;
  }

  .entry.assistant {
    align-self: flex-start;
    width: 100%;
  }

  .entry.user .entry-body {
    background: var(--crimson);
    color: #FFFFFF;
    padding: 13px 18px;
    border-radius: 14px 14px 4px 14px;
    font-size: 0.96rem;
    line-height: 1.55;
    box-shadow: 0 3px 10px rgba(186, 40, 72, 0.14);
  }

  .entry.assistant .entry-body {
    background: var(--ivory);
    border: 1px solid var(--hairline);
    border-left: 3.5px solid var(--gold);
    padding: 18px 22px;
    border-radius: 6px 14px 14px 14px;
    font-size: 0.96rem;
    line-height: 1.68;
    color: var(--ink);
  }

  .entry-actions {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--crimson);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }

  .copy-btn:hover {
    text-decoration: underline;
  }

  .entry-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 0.88rem;
    background: #FFFFFF;
  }

  .entry-body th,
  .entry-body td {
    border: 1px solid #E2CCB3;
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
  }

  .entry-body th {
    background: var(--sand);
    font-weight: 700;
    color: var(--ink);
  }

  .entry-body ul,
  .entry-body ol {
    margin: 8px 0 8px 22px;
  }

  .entry-body li {
    margin-bottom: 5px;
  }

  .entry-body h2,
  .entry-body h3,
  .entry-body h4 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--crimson);
    margin: 14px 0 6px 0;
    font-size: 1.2rem;
  }

  .starter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .starter-pill {
    background: #FFFFFF;
    border: 1px solid #DEC7B0;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .starter-pill:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: #FFFDF9;
  }

  .composer-box {
    padding: 16px 24px 18px 24px;
    background: var(--ivory);
    border-top: 1px solid var(--hairline);
  }

  .composer-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .composer-row textarea {
    flex: 1;
    min-height: 82px;
    max-height: 220px;
    resize: vertical;
    padding: 14px 16px;
    border: 1.5px solid #D5BCA3;
    border-radius: 12px;
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  .composer-row textarea:focus {
    outline: none;
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px rgba(186, 40, 72, 0.10);
  }

  .btn-send {
    flex-shrink: 0;
    height: 48px;
    padding: 0 24px;
    background: var(--crimson);
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-send:hover:not(:disabled) {
    background: var(--crimson-dark);
  }

  .btn-send:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .composer-note {
    margin-top: 7px;
    font-size: 0.75rem;
    color: var(--ink-muted);
  }

  /* 4. ONE-TIME CHOREOGRAPHED DELIVERY FOOTER
        - Auto starts at left end with boy riding inside & wheels visibly spinning
        - Drives once along the paved road toward your exact boy-home_plain_HQ.png house
        - Stops outside the house; boy steps out, opens back cargo doors, takes boxes & walks to the house
        - Settles permanently at the end! */
  .story-footer {
    background: var(--sand);
    border-top: 2px solid #E5CEB5;
    padding-top: 12px;
    margin-top: auto;
    flex-shrink: 0;
    overflow: hidden;
  }

  .story-stage {
    position: relative;
    max-width: 1120px;
    height: 215px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Paved Grey Dashed Road */
  .paved-road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 26px;
    background: #524D4F;
    border-top: 2px solid #756F72;
    z-index: 1;
  }

  .paved-road::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 11px;
    height: 3px;
    background-image: repeating-linear-gradient(
      to right,
      #F8E8D4 0px,
      #F8E8D4 24px,
      transparent 24px,
      transparent 44px
    );
  }

  /* === AUTO RIG (Moves ONCE from left end to house and stops cleanly) === */
  .auto-rig {
    position: absolute;
    bottom: 12px;
    left: 24px;
    width: 186px;
    height: 150px;
    z-index: 4;
    animation: driveOnceToHouse 3.4s cubic-bezier(0.22, 0.85, 0.36, 1) forwards;
  }

  /* Subtle suspension bounce while driving, stops at 3.4s */
  .auto-body-bounce {
    position: relative;
    width: 100%;
    height: 100%;
    animation: suspensionIdle 0.28s ease-in-out 12 alternate;
  }

  /* Exact 3D Auto PNG flipped horizontally so cabin faces right toward the house */
  .auto-img {
    width: 100%;
    height: auto;
    display: block;
    transform: scaleX(-1);
    filter: drop-shadow(0 7px 9px rgba(56, 39, 42, 0.24));
  }

  /* Boy Riding Inside Auto Cabin (Visible during drive 0s-3.5s, disappears when he steps out) */
  .rider-in-cabin {
    position: absolute;
    top: 34px;
    right: 52px;
    width: 34px;
    height: 46px;
    z-index: 5;
    animation: riderExitCabin 0.35s ease-out 3.5s forwards;
  }

  /* Back Cargo Door Swing Overlay (Left/Rear side of flipped auto, opens at 3.8s) */
  .cargo-door-panel {
    position: absolute;
    top: 22px;
    left: 4px;
    width: 34px;
    height: 62px;
    background: linear-gradient(135deg, #FFFFFF 0%, #F4ECE1 100%);
    border: 2.5px solid #BA2848;
    border-radius: 3px;
    transform-origin: left center;
    opacity: 0;
    z-index: 6;
    box-shadow: 4px 2px 8px rgba(56, 39, 42, 0.22);
    animation: openCargoDoor 0.6s ease-out 3.8s forwards;
  }

  /* Rotating Wheel Overlays Aligned on Front & Rear Tires */
  .wheel-spinner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2.5px dashed rgba(255, 248, 239, 0.78);
    box-shadow: inset 0 0 0 3px rgba(56, 39, 42, 0.65);
    pointer-events: none;
    z-index: 6;
    animation: spinWheels 0.42s linear 8 forwards;
  }

  .wheel-rear {
    bottom: 13px;
    left: 24px;
  }

  .wheel-front {
    bottom: 9px;
    right: 17px;
  }

  /* === WALKING BOY CARRYING BOXES FROM AUTO BACK DOOR TO HOUSE (3.9s - 5.8s) === */
  .walking-boy {
    position: absolute;
    bottom: 16px;
    left: calc(100% - 475px);
    width: 68px;
    height: 98px;
    z-index: 5;
    opacity: 0;
    animation: walkBoxesToHome 2.1s ease-in-out 3.9s forwards;
  }

  /* === EXACT 3D HOUSE & BOY MASCOT AT RIGHT END (boy-home_plain_HQ.png) === */
  .home-mascot-wrap {
    position: absolute;
    bottom: 10px;
    right: 20px;
    width: 248px;
    z-index: 3;
  }

  .home-mascot-img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(56, 39, 42, 0.16));
  }

  /* Signature Strip Under Road */
  .footer-bar-bottom {
    background: #EFE0CC;
    border-top: 1px solid #DFC9AF;
    padding: 8px 24px;
  }

  .footer-bar-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-muted);
    flex-wrap: wrap;
    gap: 8px;
  }

  .footer-bar-inner strong {
    color: var(--crimson);
  }

  /* === ONE-TIME CHOREOGRAPHY KEYFRAMES === */
  @keyframes driveOnceToHouse {
    0%   { left: 20px; transform: rotate(0deg); }
    92%  { left: calc(100% - 485px); transform: rotate(0deg); }
    96%  { left: calc(100% - 480px); transform: rotate(1.4deg); }
    100% { left: calc(100% - 482px); transform: rotate(0deg); }
  }

  @keyframes suspensionIdle {
    from { transform: translateY(0px); }
    to   { transform: translateY(-2px); }
  }

  @keyframes spinWheels {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes riderExitCabin {
    0%   { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(-14px); }
  }

  @keyframes openCargoDoor {
    0%   { opacity: 0; transform: perspective(240px) rotateY(0deg); }
    20%  { opacity: 1; transform: perspective(240px) rotateY(-15deg); }
    100% { opacity: 1; transform: perspective(240px) rotateY(-68deg); }
  }

  @keyframes walkBoxesToHome {
    0%   { opacity: 0; left: calc(100% - 492px); transform: translateY(0px); }
    15%  { opacity: 1; left: calc(100% - 472px); transform: translateY(-3px); }
    35%  { opacity: 1; left: calc(100% - 425px); transform: translateY(0px); }
    55%  { opacity: 1; left: calc(100% - 375px); transform: translateY(-3px); }
    78%  { opacity: 1; left: calc(100% - 315px); transform: translateY(0px); }
    92%  { opacity: 1; left: calc(100% - 285px); transform: translateY(0px); }
    100% { opacity: 0; left: calc(100% - 270px); transform: translateY(0px); }
  }

  @media (max-width: 760px) {
    .workspace-wrap { padding: 12px; }
    .chat-stream { padding: 16px; }
    .composer-row { flex-direction: column; align-items: stretch; }
    .btn-send { width: 100%; }
    .story-stage { height: 170px; }
    .auto-rig { width: 136px; height: 110px; }
    .home-mascot-wrap { width: 185px; right: 10px; }
    .wheel-spinner { width: 20px; height: 20px; }
    .wheel-rear { bottom: 9px; left: 17px; }
    .wheel-front { bottom: 6px; right: 12px; }
    @keyframes driveOnceToHouse {
      0%   { left: 10px; }
      100% { left: calc(100% - 340px); }
    }
    @keyframes walkBoxesToHome {
      0%   { opacity: 0; left: calc(100% - 345px); }
      20%  { opacity: 1; left: calc(100% - 320px); }
      85%  { opacity: 1; left: calc(100% - 215px); }
      100% { opacity: 0; left: calc(100% - 200px); }
    }
  }
</style>
</head>
<body>

  <!-- Top Crimson Accent Strip -->
  <div class="top-crimson-bar"></div>

  <!-- Official RitualEase Intelligence Header -->
  <header class="brand-header">
    <div class="logo-lockup">
      <img src="ritualease-logo-mark-1024-transparent.png" alt="RitualEase Logo" class="logo-mark-img">
      <div class="logo-text-stack">
        <div class="logo-title-row">
          <span class="logo-brand-name">RitualEase</span>

  <!-- Continuous Conversation Workspace -->
  <main class="workspace-wrap">

        <button type="button" class="btn-new-chat" onclick="resetChat()">+ New Chat</button>
      </div>

      <div class="chat-stream" id="chatStream"></div>

      <div class="composer-box">

          <textarea id="qInput" rows="3" placeholder="Ask anything across your packages, samagri lists, SOPs, vendors, or daily team logs..."></textarea>

  <!-- One-Time Choreographed Delivery Footer -->
  <footer class="story-footer">
    <div class="story-stage">
      <!-- Paved Dashed Road Connecting Auto & Home -->

      <!-- 1. Real 3D E-Cargo Auto Mascot with Boy Riding Inside & Spinning Wheels -->
      <div class="auto-rig">
        <div class="auto-body-bounce">
          <img src="auto_plain_HQ_with-RE-logo.png" alt="RitualEase E-Cargo Auto" class="auto-img">

          <!-- Boy Riding Inside Cabin -->

            <circle cx="20" cy="21" r="7" fill="#F2C39B"/>

            <path d="M11 30C11 28 15 27 20 27C25 27 29 28 29 30L31 48H9L11 30Z" fill="#BA2848"/>
            <!-- Arm Reaching Steering Handlebar -->
            <path d="M23 33L33 38" stroke="#F2C39B" stroke-width="3.5" stroke-linecap="round"/>
          </svg>

          <!-- Swinging Back Cargo Door -->
          <div class="cargo-door-panel" aria-hidden="true"></div>

          <!-- Rotating Wheel Overlays -->
          <div class="wheel-spinner wheel-rear" aria-hidden="true"></div>
          <div class="wheel-spinner wheel-front" aria-hidden="true"></div>
        </div>
      </div>

      <!-- 2. Boy Carrying Boxes From Back of Auto to the House -->
      <div class="walking-boy" aria-hidden="true">
        <svg width="68" height="98" viewBox="0 0 68 98" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="94" rx="17" ry="3.5" fill="rgba(56,39,42,0.22)"/>
          <!-- White Cap -->

          <path d="M29 20H47" stroke="#BA2848" stroke-width="3" stroke-linecap="round"/>

          <circle cx="29" cy="28" r="8.5" fill="#F2C39B"/>

          <path d="M29 31C31 32.5 33.5 32.2 34.5 30.8" stroke="#38272A" stroke-width="1.3" stroke-linecap="round"/>
          <!-- Crimson RitualEase Polo -->
          <path d="M18 38C18 36 22 35 29 35C36 35 40 36 40 38L42 63H16L18 38Z" fill="#BA2848"/>
          <!-- Trousers & Sneakers -->

          <text x="43" y="54" text-anchor="middle" fill="#BA2848" font-family="Nunito Sans, sans-serif" font-weight="800" font-size="6.2">RitualEase</text>

      <!-- 3. Exact 3D Modern House & Boy Mascot at Right End -->
      <div class="home-mascot-wrap">
        <img src="boy-home_plain_HQ.png" alt="RitualEase Coordinator and Modern Home" class="home-mascot-img">

    </div>

    <div class="footer-bar-bottom">
      <div class="footer-bar-inner">
        <span><strong>RitualEase Intelligence</strong> • ritualease.com</span>
        <span>Celebrations, delivered at home</span>
      </div>
    </div>
  </footer>

<script src="brain.js?v=14"></script>
<script>
let chatHistory = [];
let isBusy = false;

function initChat() {
  const stream = document.getElementById("chatStream");
  stream.innerHTML = `
    <div class="entry assistant">
      <div class="entry-body">
        <strong>Namaste!</strong> How can I help you today?
        <div class="starter-row">
          <button type="button" class="starter-pill" onclick="useStarter('List all Puja packages and exact offerings in a table')">Puja Offerings Table</button>
          <button type="button" class="starter-pill" onclick="useStarter('Draft a ready-to-send WhatsApp quote for Satyanarayan Katha including customer-owned utensils')">WhatsApp Puja Quote</button>
          <button type="button" class="starter-pill" onclick="useStarter('Summarize recent team updates and flag any missing follow-ups')">Audit Team Logs</button>
        </div>
      </div>
    </div>
  `;
}

function useStarter(text) {
  document.getElementById("qInput").value = text;
  sendMessage();
}

function resetChat() {
  chatHistory = [];
  initChat();
  document.getElementById("qInput").focus();
}

document.getElementById("qInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  if (isBusy) return;
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if (!q) { input.focus(); return; }

  const scriptUrl = getScriptUrl();
  if (!scriptUrl) {
    appendEntry("assistant", "⚠️ **DEFAULT_SCRIPT_URL** is missing in `brain.js` on GitHub.");
    return;
  }

  input.value = "";
  chatHistory.push({ role: "user", content: q });
  appendEntry("user", q);

  isBusy = true;
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  btn.textContent = "Thinking...";

  const typingId = "typing_" + Date.now();
  appendEntry("assistant", "Thinking...", typingId);

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({
        action: "chat",
        history: chatHistory
      })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      replaceEntry(typingId, "⚠️ Backend returned HTML instead of JSON. Ensure Apps Script is deployed with **Who has access: Anyone**.");
      isBusy = false;
      btn.disabled = false;
      btn.textContent = "Send ↵";
      return;
    }

    const reply = (data.answer && data.answer.trim()) ? data.answer.trim() : ("⚠️ Unexpected response: " + raw);
    chatHistory.push({ role: "assistant", content: reply });
    replaceEntry(typingId, reply, true);
  } catch (err) {
    replaceEntry(typingId, "⚠️ Network error: " + err.message);
  }

  isBusy = false;
  btn.disabled = false;
  btn.textContent = "Send ↵";
  input.focus();
}

function appendEntry(role, text, id) {
  const stream = document.getElementById("chatStream");
  const entry = document.createElement("div");
  entry.className = "entry " + role;
  if (id) entry.id = id;

  const body = document.createElement("div");
  body.className = "entry-body";
  body.innerHTML = role === "user" ? escapeHtml(text).replace(/\n/g, "<br>") : renderMarkdown(text);
  entry.appendChild(body);

  if (role === "assistant" && !id) {
    entry.appendChild(buildActions(text));
  }

  stream.appendChild(entry);
  stream.scrollTop = stream.scrollHeight;
}

function replaceEntry(id, text, showCopy) {
  const entry = document.getElementById(id);
  if (!entry) return;
  entry.removeAttribute("id");
  const body = entry.querySelector(".entry-body");
  body.innerHTML = renderMarkdown(text);
  if (showCopy) {
    entry.appendChild(buildActions(text));
  }
  const stream = document.getElementById("chatStream");
  stream.scrollTop = stream.scrollHeight;
}

function buildActions(rawText) {
  const bar = document.createElement("div");
  bar.className = "entry-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy-btn";
  copyBtn.textContent = "Copy response";
  copyBtn.onclick = function() {
    navigator.clipboard.writeText(rawText);
    copyBtn.textContent = "Copied ✓";
    setTimeout(() => copyBtn.textContent = "Copy response", 1800);
  };
  bar.appendChild(copyBtn);
  return bar;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) continue;

      if (!inTable) {
        html += "<table><thead><tr>" + cells.map(c => "<th>" + inlineFormat(c) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => "<td>" + inlineFormat(c) + "</td>").join("") + "</tr>";
      }
      continue;
    } else if (inTable) {
      html += "</tbody></table>";
      inTable = false;
    }

    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineFormat(line.replace(/^[-*•]\s+/, "")) + "</li>";
      continue;
    } else if (inList) {
      html += "</ul>";
      inList = false;
    }

    if (line.startsWith("### ")) {
      html += "<h4>" + inlineFormat(line.slice(4)) + "</h4>";
    } else if (line.startsWith("## ")) {
      html += "<h3>" + inlineFormat(line.slice(3)) + "</h3>";
    } else if (line.startsWith("# ")) {
      html += "<h2>" + inlineFormat(line.slice(2)) + "</h2>";
    } else if (line === "---") {
      html += "<hr style='border:none;border-top:1px solid #e6d5c3;margin:10px 0;'>";
    } else if (line.length > 0) {
      html += "<p style='margin:6px 0;'>" + inlineFormat(line) + "</p>";
    }
  }

  if (inTable) html += "</tbody></table>";
  if (inList) html += "</ul>";
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code style='background:#f3e6d8;padding:1px 5px;border-radius:4px;'>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" style="color:#BA2848;font-weight:600;">Open File ↗</a>');
}

initChat();
</script>
