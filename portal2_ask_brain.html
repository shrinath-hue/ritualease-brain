<script src="brain.js?v=19"></script>
<script>
let chatHistory = [];
let isBusy = false;

// Opt-in local device file index (Strictly empty & inactive unless user explicitly enables)
let deviceEnabled = false;
let localDeviceFiles = []; // [{ path, name, text }]

function resolveScriptUrl() {
  if (typeof getScriptUrl === "function") {
    const u = getScriptUrl();
    if (u && u.indexOf("http") === 0) return u;
  }
  if (typeof DEFAULT_SCRIPT_URL !== "undefined" && DEFAULT_SCRIPT_URL.indexOf("http") === 0) {
    return DEFAULT_SCRIPT_URL;
  }
  return (localStorage.getItem("ritualease_script_url") || "").trim();
}

async function toggleDeviceAccess() {
  const btn = document.getElementById("deviceBtn");
  const label = document.getElementById("deviceBtnLabel");

  // Turn OFF and immediately purge memory if currently enabled
  if (deviceEnabled) {
    deviceEnabled = false;
    localDeviceFiles = [];
    btn.classList.remove("active");
    label.textContent = "Device Folder: Off";
    return;
  }

  // Turn ON only via explicit user permission gesture
  if (window.showDirectoryPicker) {
    try {
      const dirHandle = await window.showDirectoryPicker({ mode: "read" });
      label.textContent = "Indexing...";
      localDeviceFiles = [];
      await scanDirectoryHandle(dirHandle, dirHandle.name, 0);
      deviceEnabled = true;
      btn.classList.add("active");
      label.textContent = "Device (" + localDeviceFiles.length + " files) • Disconnect";
    } catch (err) {
      deviceEnabled = false;
      localDeviceFiles = [];
      label.textContent = "Device Folder: Off";
    }
  } else {
    // Fallback for Safari / Mobile browsers
    document.getElementById("mobileFolderInput").click();
  }
}

async function scanDirectoryHandle(dirHandle, prefix, depth) {
  if (depth > 3 || localDeviceFiles.length >= 120) return;
  for await (const entry of dirHandle.values()) {
    if (localDeviceFiles.length >= 120) break;
    if (entry.kind === "file") {
      try {
        const file = await entry.getFile();
        await ingestLocalFile(file, prefix + "/" + entry.name);
      } catch (e) {}
    } else if (entry.kind === "directory" && !entry.name.startsWith(".")) {
      await scanDirectoryHandle(entry, prefix + "/" + entry.name, depth + 1);
    }
  }
}

async function handleFallbackFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  const btn = document.getElementById("deviceBtn");
  const label = document.getElementById("deviceBtnLabel");
  label.textContent = "Indexing...";
  localDeviceFiles = [];
  const limit = Math.min(fileList.length, 120);
  for (let i = 0; i < limit; i++) {
    const f = fileList[i];
    await ingestLocalFile(f, f.webkitRelativePath || f.name);
  }
  deviceEnabled = true;
  btn.classList.add("active");
  label.textContent = "Device (" + localDeviceFiles.length + " files) • Disconnect";
}

async function ingestLocalFile(file, relPath) {
  const lower = file.name.toLowerCase();
  const isTextReadable = /\.(txt|md|csv|json|html|xml|log|js|py|tsv)$/i.test(lower);
  let text = "";
  if (isTextReadable && file.size < 400000) {
    try { text = (await file.text()).slice(0, 6000); } catch (e) {}
  } else {
    text = "[Binary/Office File: " + file.name + " (" + Math.round(file.size / 1024) + " KB)]";
  }
  localDeviceFiles.push({ path: relPath, name: file.name, text: text });
}

function buildRelevantDeviceContext(query) {
  if (!deviceEnabled || localDeviceFiles.length === 0) return "";
  const terms = (query || "").toLowerCase().split(/\W+/).filter(w => w.length > 2);
  const ranked = localDeviceFiles.map(f => {
    const hay = (f.path + " " + f.text).toLowerCase();
    let score = 0;
    terms.forEach(t => {
      if (f.name.toLowerCase().includes(t)) score += 5;
      if (hay.includes(t)) score += 1;
    });
    return { file: f, score };
  }).sort((a, b) => b.score - a.score);

  const dirSummary = "DEVICE DIRECTORY (" + localDeviceFiles.length + " files): " +
    localDeviceFiles.map(f => f.path).join(", ");
  const topFiles = ranked.slice(0, 4).map(r =>
    "--- LOCAL FILE: " + r.file.path + " ---\n" + r.file.text
  ).join("\n\n");

  return dirSummary + "\n\n" + topFiles;
}

function initChat() {
  const stream = document.getElementById("chatStream");
  stream.innerHTML = `
    <div class="entry assistant">
      <div class="entry-body">
        <strong>Namaste!</strong> How can I help you today? Ask any question, or instruct me to build an <strong>Excel (.xlsx)</strong>, <strong>Document (.docx)</strong>, or <strong>Brand Image</strong>.
        <div class="starter-row">
          <button type="button" class="starter-pill" onclick="useStarter('Create an Excel sheet comparing all Puja packages, inclusions, and customer utensils')">Create Puja Excel (.xlsx)</button>
          <button type="button" class="starter-pill" onclick="useStarter('Create a Word document SOP for on-day home birthday coordination')">Create Ops Doc (.docx)</button>
          <button type="button" class="starter-pill" onclick="useStarter('Generate an image of a warm marigold and ivory Satyanarayan puja setup at home')">Generate Puja Visual</button>
        </div>
      </div>
    </div>
  `;
}

function useStarter(text) {
  document.getElementById("qInput").value = text;
  sendMessage();
}

function resetChat() {
  chatHistory = [];
  initChat();
  if (window.innerWidth > 680) document.getElementById("qInput").focus();
}

document.getElementById("qInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 680) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  if (isBusy) return;
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if (!q) { input.focus(); return; }

  const scriptUrl = resolveScriptUrl();
  if (!scriptUrl) {
    appendEntry("assistant", "⚠️ **DEFAULT_SCRIPT_URL** is missing in `brain.js` on GitHub.");
    return;
  }

  input.value = "";
  chatHistory.push({ role: "user", content: q });
  appendEntry("user", q);

  isBusy = true;
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  btn.textContent = "Working...";

  const typingId = "typing_" + Date.now();
  appendEntry("assistant", "Working on it...", typingId);

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({
        action: "chat",
        history: chatHistory,
        deviceContext: buildRelevantDeviceContext(q)
      })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      replaceEntry(typingId, "⚠️ Backend returned HTML instead of JSON. Ensure Apps Script is deployed with **Who has access: Anyone**.");
      isBusy = false;
      btn.disabled = false;
      btn.textContent = "Send ↵";
      return;
    }

    const reply = (data.answer && data.answer.trim()) ? data.answer.trim() : ("⚠️ Unexpected response: " + raw);
    chatHistory.push({ role: "assistant", content: reply });
    replaceEntry(typingId, reply, true, data.artifact || null);
  } catch (err) {
    replaceEntry(typingId, "⚠️ Network error: " + err.message);
  }

  isBusy = false;
  btn.disabled = false;
  btn.textContent = "Send ↵";
  if (window.innerWidth > 680) input.focus();
}

function renderArtifactHtml(art) {
  if (!art) return "";
  if (art.type === "excel") {
    return `
      <div class="artifact-card">
        <div class="artifact-header">
          <span class="artifact-title">📊 ${escapeHtml(art.title || "Excel Workbook")}</span>
          <span class="artifact-badge">Excel (.xlsx)</span>
        </div>
        <div class="artifact-links">
          <a href="${art.downloadUrl}" target="_blank" class="btn-artifact-primary">⬇ Download Excel (.xlsx)</a>
          <a href="${art.viewUrl}" target="_blank" class="btn-artifact-secondary">Open in Google Sheets ↗</a>
        </div>
      </div>
    `;
  }
  if (art.type === "doc") {
    return `
      <div class="artifact-card">
        <div class="artifact-header">
          <span class="artifact-title">📄 ${escapeHtml(art.title || "Document")}</span>
          <span class="artifact-badge">Word / Google Doc</span>
        </div>
        <div class="artifact-links">
          <a href="${art.downloadUrl}" target="_blank" class="btn-artifact-primary">⬇ Download Word (.docx)</a>
          ${art.pdfUrl ? `<a href="${art.pdfUrl}" target="_blank" class="btn-artifact-secondary">⬇ PDF</a>` : ""}
          <a href="${art.viewUrl}" target="_blank" class="btn-artifact-secondary">Open in Google Docs ↗</a>
        </div>
      </div>
    `;
  }
  if (art.type === "image") {
    return `
      <div class="artifact-card">
        <div class="artifact-header">
          <span class="artifact-title">🎨 ${escapeHtml(art.title || "Generated Visual")}</span>
          <span class="artifact-badge">Brand Kit v4</span>
        </div>
        <img src="${art.imageUrl}" alt="Generated RitualEase Visual" class="artifact-preview-img">
        <div class="artifact-links">
          <a href="${art.downloadUrl}" download="RitualEase_Visual.png" target="_blank" class="btn-artifact-primary">⬇ Download Image</a>
          ${art.viewUrl ? `<a href="${art.viewUrl}" target="_blank" class="btn-artifact-secondary">View in Drive ↗</a>` : ""}
        </div>
      </div>
    `;
  }
  return "";
}

function appendEntry(role, text, id) {
  const stream = document.getElementById("chatStream");
  const entry = document.createElement("div");
  entry.className = "entry " + role;
  if (id) entry.id = id;

  const body = document.createElement("div");
  body.className = "entry-body";
  body.innerHTML = role === "user" ? escapeHtml(text).replace(/\n/g, "<br>") : renderMarkdown(text);
  entry.appendChild(body);

  if (role === "assistant" && !id) {
    entry.appendChild(buildActions(text));
  }

  stream.appendChild(entry);
  stream.scrollTop = stream.scrollHeight;
}

function replaceEntry(id, text, showCopy, artifact) {
  const entry = document.getElementById(id);
  if (!entry) return;
  entry.removeAttribute("id");
  const body = entry.querySelector(".entry-body");
  body.innerHTML = renderMarkdown(text) + renderArtifactHtml(artifact);
  if (showCopy) {
    entry.appendChild(buildActions(text));
  }
  const stream = document.getElementById("chatStream");
  stream.scrollTop = stream.scrollHeight;
}

function buildActions(rawText) {
  const bar = document.createElement("div");
  bar.className = "entry-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy-btn";
  copyBtn.textContent = "Copy response";
  copyBtn.onclick = function() {
    navigator.clipboard.writeText(rawText);
    copyBtn.textContent = "Copied ✓";
    setTimeout(() => copyBtn.textContent = "Copy response", 1800);
  };
  bar.appendChild(copyBtn);
  return bar;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) continue;

      if (!inTable) {
        html += '<div class="table-scroll"><table><thead><tr>' + cells.map(c => "<th>" + inlineFormat(c) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => "<td>" + inlineFormat(c) + "</td>").join("") + "</tr>";
      }
      continue;
    } else if (inTable) {
      html += "</tbody></table></div>";
      inTable = false;
    }

    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineFormat(line.replace(/^[-*•]\s+/, "")) + "</li>";
      continue;
    } else if (inList) {
      html += "</ul>";
      inList = false;
    }

    if (line.startsWith("### ")) {
      html += "<h4>" + inlineFormat(line.slice(4)) + "</h4>";
    } else if (line.startsWith("## ")) {
      html += "<h3>" + inlineFormat(line.slice(3)) + "</h3>";
    } else if (line.startsWith("# ")) {
      html += "<h2>" + inlineFormat(line.slice(2)) + "</h2>";
    } else if (line === "---") {
      html += "<hr style='border:none;border-top:1px solid #e6d5c3;margin:10px 0;'>";
    } else if (line.length > 0) {
      html += "<p style='margin:6px 0;'>" + inlineFormat(line) + "</p>";
    }
  }

  if (inTable) html += "</tbody></table></div>";
  if (inList) html += "</ul>";
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code style='background:#f3e6d8;padding:1px 5px;border-radius:4px;'>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" style="color:#BA2848;font-weight:600;">Open File ↗</a>');
}

initChat();
</script>
</body>
</html>
