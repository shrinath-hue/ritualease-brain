<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask RitualEase Brain — ritualease.com</title>
<link rel="stylesheet" href="styles.css?v=9">
<style>
  main.chat-main {
    max-width: 980px !important;
    width: 100% !important;
    margin: 0 auto !important;
    padding: 16px 20px 24px 20px !important;
    box-sizing: border-box;
  }
  .chat-shell {
    width: 100%;
    background: #ffffff;
    border: 1px solid #ead9c6;
    border-radius: 18px;
    box-shadow: 0 12px 34px rgba(56, 39, 42, 0.06);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 165px);
    min-height: 580px;
    overflow: hidden;
  }
  .chat-topbar {
    padding: 16px 24px;
    background: #FFF8EF;
    border-bottom: 1px solid #ead9c6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .chat-topbar h1 {
    font-size: 1.3rem !important;
    margin: 0 0 3px 0 !important;
    padding: 0 !important;
    border: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
    text-decoration: none !important;
    color: #38272A !important;
  }
  .chat-topbar h1::after,
  .chat-topbar h1::before {
    display: none !important;
    content: none !important;
  }
  .chat-topbar span {
    font-size: 0.82rem;
    color: #7a6266;
    display: block;
  }
  .chat-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-chip {
    width: auto !important;
    background: #ffffff;
    border: 1px solid #d9c3ad;
    color: #38272A;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-chip:hover {
    border-color: #BA2848;
    color: #BA2848;
    background: #fff8ef;
  }
  .chat-stream {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: #fffdfb;
  }
  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }
  .msg-row.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg-row.assistant {
    align-self: flex-start;
    align-items: flex-start;
    width: 100%;
    max-width: 92%;
  }
  .msg-bubble {
    padding: 15px 20px;
    border-radius: 16px;
    font-size: 0.96rem;
    line-height: 1.65;
    color: #38272A;
    word-wrap: break-word;
  }
  .msg-row.user .msg-bubble {
    background: #BA2848;
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .msg-row.assistant .msg-bubble {
    background: #FFF8EF;
    border: 1px solid #ead9c6;
    border-bottom-left-radius: 4px;
    width: 100%;
    box-sizing: border-box;
  }
  .msg-meta {
    font-size: 0.75rem;
    color: #8c7377;
    margin-top: 5px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .copy-link {
    width: auto !important;
    color: #BA2848;
    cursor: pointer;
    font-weight: 600;
    background: none;
    border: none;
    padding: 0;
    font-size: 0.75rem;
  }
  .msg-bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 0.88rem;
    background: #ffffff;
  }
  .msg-bubble th, .msg-bubble td {
    border: 1px solid #e2cbb3;
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
  }
  .msg-bubble th {
    background: #F8E8D4;
    font-weight: 700;
    color: #38272A;
  }
  .msg-bubble ul, .msg-bubble ol {
    margin: 8px 0 8px 22px;
    padding: 0;
  }
  .msg-bubble li {
    margin-bottom: 5px;
  }
  .msg-bubble h2, .msg-bubble h3, .msg-bubble h4 {
    margin: 12px 0 6px 0;
    color: #BA2848;
    border: none !important;
  }
  .starter-prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .starter-pill {
    width: auto !important;
    background: #ffffff;
    border: 1px solid #e2cbb3;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 0.82rem;
    color: #38272A;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .starter-pill:hover {
    border-color: #BA2848;
    color: #BA2848;
  }

  /* Spacious, Full-Width Composer Area */
  .chat-composer-wrap {
    padding: 16px 22px;
    background: #FFF8EF;
    border-top: 1px solid #ead9c6;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-composer-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    width: 100%;
  }
  .chat-composer-row textarea {
    flex: 1 1 auto !important;
    width: 100% !important;
    min-width: 0 !important;
    min-height: 76px !important;
    max-height: 200px !important;
    resize: vertical !important;
    padding: 13px 16px !important;
    border: 1.5px solid #d4bba2 !important;
    border-radius: 12px !important;
    font-family: inherit !important;
    font-size: 0.98rem !important;
    line-height: 1.5 !important;
    background: #ffffff !important;
    color: #38272A !important;
    box-sizing: border-box !important;
    margin: 0 !important;
  }
  .chat-composer-row textarea:focus {
    outline: none !important;
    border-color: #BA2848 !important;
    box-shadow: 0 0 0 3px rgba(186, 40, 72, 0.12) !important;
  }
  .chat-send-btn {
    flex: 0 0 auto !important;
    width: auto !important;
    min-width: 120px !important;
    height: 48px !important;
    padding: 0 22px !important;
    border-radius: 12px !important;
    font-size: 0.95rem !important;
    font-weight: 700 !important;
    margin: 0 !important;
    cursor: pointer;
  }
  .composer-hint {
    font-size: 0.75rem;
    color: #8c7377;
    display: flex;
    justify-content: space-between;
  }
  @media (max-width: 640px) {
    main.chat-main { padding: 10px !important; }
    .chat-shell { height: calc(100vh - 135px); }
    .chat-composer-row { flex-direction: column; align-items: stretch; }
    .chat-send-btn { width: 100% !important; }
  }
</style>
</head>
<body>
<div class="accent-strip"></div>
<header>
  <div class="brand-mark">
    <span class="re-seal">RE</span>
    <span class="brand-title">ritualease.com</span>
  </div>
  <div class="brand-sub">RitualEase Intelligence • Continuous Operations Chat</div>
</header>

<main class="chat-main">
  <div class="chat-shell">
    <div class="chat-topbar">
      <div>
        <h1>Ask RitualEase</h1>
        <span id="kbStatus">Connected to Drive Knowledge Base, Master Rules & Team Logs</span>
      </div>
      <div class="chat-actions">
        <button type="button" class="btn-chip" id="syncBtn" onclick="syncDrive()">↻ Sync Drive Files</button>
        <button type="button" class="btn-chip" onclick="resetChat()">+ New Chat</button>
      </div>
    </div>

    <div class="chat-stream" id="chatStream"></div>

    <div class="chat-composer-wrap">
      <div class="chat-composer-row">
        <textarea id="qInput" rows="3" placeholder="Type your question or follow-up here... (e.g. What are the exact offerings in Navgraha Pooja? Or: Turn that into a WhatsApp quote for a client in GNW 201301)"></textarea>
        <button type="button" class="btn-primary chat-send-btn" id="askBtn" onclick="sendMessage()">Send ↵</button>
      </div>
      <div class="composer-hint">
        <span>Press <strong>Enter</strong> to send • <strong>Shift + Enter</strong> for a new line</span>
        <span>Reads all Drive Sheets, Excel, Word, PDF & Images</span>
      </div>
    </div>
  </div>
</main>

<footer>ritualease.com • Private Brain Query</footer>

<script src="brain.js?v=9"></script>
<script>
let chatHistory = [];
let isBusy = false;

function initChat() {
  const stream = document.getElementById("chatStream");
  stream.innerHTML = `
    <div class="msg-row assistant">
      <div class="msg-bubble">
        <strong>Namaste!</strong> I’m <strong>RitualEase Intelligence</strong>. Ask me anything across all your uploaded Google Drive spreadsheets, Word docs, PDFs, images, packages, vendors, and daily team logs—and feel free to ask follow-up questions to refine tables, checklists, or WhatsApp client quotes.
        <div class="starter-prompts">
          <button type="button" class="starter-pill" onclick="useStarter('List all Puja packages and exact offerings from our Drive files in a table')">Puja Offerings Table</button>
          <button type="button" class="starter-pill" onclick="useStarter('Draft a ready-to-send WhatsApp quote for Satyanarayan Katha including customer-owned utensils')">WhatsApp Puja Quote</button>
          <button type="button" class="starter-pill" onclick="useStarter('Summarize recent team updates and flag any missing follow-ups')">Audit Team Logs</button>
        </div>
      </div>
    </div>
  `;
}

function useStarter(text) {
  document.getElementById("qInput").value = text;
  sendMessage();
}

function resetChat() {
  chatHistory = [];
  initChat();
  document.getElementById("qInput").focus();
}

document.getElementById("qInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function syncDrive() {
  const scriptUrl = getScriptUrl();
  if (!scriptUrl) return;
  const syncBtn = document.getElementById("syncBtn");
  const statusEl = document.getElementById("kbStatus");
  syncBtn.disabled = true;
  syncBtn.textContent = "Syncing Drive...";
  statusEl.textContent = "Scanning & indexing all files in your Google Drive folder...";

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({ action: "sync" })
    });
    const data = await res.json();
    statusEl.textContent = data.message || "Drive files synced.";
  } catch (err) {
    statusEl.textContent = "Sync failed: " + err.message;
  }
  syncBtn.disabled = false;
  syncBtn.textContent = "↻ Sync Drive Files";
}

async function sendMessage() {
  if (isBusy) return;
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if (!q) { input.focus(); return; }

  const scriptUrl = getScriptUrl();
  if (!scriptUrl) {
    appendBubble("assistant", "⚠️ **DEFAULT_SCRIPT_URL** is missing in `brain.js` on GitHub.");
    return;
  }

  input.value = "";
  chatHistory.push({ role: "user", content: q });
  appendBubble("user", q);

  isBusy = true;
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  btn.textContent = "Thinking...";

  const typingId = "typing_" + Date.now();
  appendBubble("assistant", "Reading your Drive spreadsheets, docs, and conversation history...", typingId);

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({
        action: "chat",
        history: chatHistory
      })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      replaceBubble(typingId, "⚠️ Backend returned HTML instead of JSON. Ensure Apps Script is deployed with **Who has access: Anyone**.");
      isBusy = false;
      btn.disabled = false;
      btn.textContent = "Send ↵";
      return;
    }

    const reply = (data.answer && data.answer.trim()) ? data.answer.trim() : ("⚠️ Unexpected response: " + raw);
    chatHistory.push({ role: "assistant", content: reply });
    if (data.fileCount !== undefined) {
      document.getElementById("kbStatus").textContent = "Synced with " + data.fileCount + " Drive files • Multi-turn chat active";
    }
    replaceBubble(typingId, reply, true);
  } catch (err) {
    replaceBubble(typingId, "⚠️ Network error: " + err.message);
  }

  isBusy = false;
  btn.disabled = false;
  btn.textContent = "Send ↵";
  input.focus();
}

function appendBubble(role, text, id) {
  const stream = document.getElementById("chatStream");
  const row = document.createElement("div");
  row.className = "msg-row " + role;
  if (id) row.id = id;

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.innerHTML = role === "user" ? escapeHtml(text).replace(/\n/g, "<br>") : renderMarkdown(text);
  row.appendChild(bubble);

  if (role === "assistant" && !id) {
    row.appendChild(buildMetaBar(text));
  }

  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;
}

function replaceBubble(id, text, showCopy) {
  const row = document.getElementById(id);
  if (!row) return;
  row.removeAttribute("id");
  const bubble = row.querySelector(".msg-bubble");
  bubble.innerHTML = renderMarkdown(text);
  if (showCopy) {
    row.appendChild(buildMetaBar(text));
  }
  const stream = document.getElementById("chatStream");
  stream.scrollTop = stream.scrollHeight;
}

function buildMetaBar(rawText) {
  const meta = document.createElement("div");
  meta.className = "msg-meta";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy-link";
  copyBtn.textContent = "Copy response";
  copyBtn.onclick = function() {
    navigator.clipboard.writeText(rawText);
    copyBtn.textContent = "Copied ✓";
    setTimeout(() => copyBtn.textContent = "Copy response", 1800);
  };
  meta.appendChild(copyBtn);
  return meta;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) continue;

      if (!inTable) {
        html += "<table><thead><tr>" + cells.map(c => "<th>" + inlineFormat(c) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => "<td>" + inlineFormat(c) + "</td>").join("") + "</tr>";
      }
      continue;
    } else if (inTable) {
      html += "</tbody></table>";
      inTable = false;
    }

    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineFormat(line.replace(/^[-*•]\s+/, "")) + "</li>";
      continue;
    } else if (inList) {
      html += "</ul>";
      inList = false;
    }

    if (line.startsWith("### ")) {
      html += "<h4>" + inlineFormat(line.slice(4)) + "</h4>";
    } else if (line.startsWith("## ")) {
      html += "<h3>" + inlineFormat(line.slice(3)) + "</h3>";
    } else if (line.startsWith("# ")) {
      html += "<h2>" + inlineFormat(line.slice(2)) + "</h2>";
    } else if (line === "---") {
      html += "<hr style='border:none;border-top:1px solid #ead9c6;margin:10px 0;'>";
    } else if (line.length > 0) {
      html += "<p style='margin:6px 0;'>" + inlineFormat(line) + "</p>";
    }
  }

  if (inTable) html += "</tbody></table>";
  if (inList) html += "</ul>";
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code style='background:#f3e6d8;padding:1px 5px;border-radius:4px;'>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" style="color:#BA2848;font-weight:600;">Open File ↗</a>');
}

initChat();
</script>
</body>
</html>
