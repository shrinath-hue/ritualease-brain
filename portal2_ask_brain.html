<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask RitualEase — ritualease.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #BA2848;
    --crimson-dark: #971d38;
    --ivory: #FFF8EF;
    --sand: #F8E8D4;
    --gold: #EBAA32;
    --ink: #38272A;
    --ink-muted: #755E62;
    --hairline: #E6D5C3;
    --card-bg: #FFFFFF;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--ivory);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* 1. Top Crimson Brand Strip */
  .top-crimson-bar {
    height: 7px;
    width: 100%;
    background: var(--crimson);
    flex-shrink: 0;
  }

  /* 2. Authentic ritualease.com Header (100% Flat Bottom Edge) */
  .brand-header {
    background: var(--ivory);
    padding: 20px 24px 16px 24px;
    text-align: center;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }

  .logo-lockup {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    text-decoration: none;
  }

  .logo-wordmark-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }

  .logo-domain {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 1.55rem;
    letter-spacing: -0.02em;
    color: var(--crimson);
    line-height: 1.05;
  }

  .logo-tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 0.96rem;
    color: var(--ink);
    margin-top: 2px;
    letter-spacing: 0.01em;
  }

  /* 3. Editorial Workspace Container */
  .workspace-wrap {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 20px 24px 20px;
    display: flex;
    flex-direction: column;
  }

  .workspace-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(56, 39, 42, 0.045);
    display: flex;
    flex-direction: column;
    min-height: 520px;
    overflow: hidden;
  }

  /* Sub-header inside workspace (Clean, zero underline under title) */
  .workspace-bar {
    padding: 15px 24px;
    background: var(--ivory);
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .workspace-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink);
    border: none !important;
    text-decoration: none !important;
    line-height: 1.1;
  }

  .btn-new-chat {
    background: #FFFFFF;
    border: 1px solid #D9C3AD;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-new-chat:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: var(--ivory);
  }

  /* Continuous Conversation Stream */
  .chat-stream {
    flex: 1;
    overflow-y: auto;
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #FFFDFB;
  }

  .entry {
    display: flex;
    flex-direction: column;
  }

  .entry.user {
    align-self: flex-end;
    max-width: 80%;
  }

  .entry.assistant {
    align-self: flex-start;
    width: 100%;
  }

  .entry.user .entry-body {
    background: var(--crimson);
    color: #FFFFFF;
    padding: 13px 18px;
    border-radius: 14px 14px 4px 14px;
    font-size: 0.96rem;
    line-height: 1.55;
    box-shadow: 0 3px 10px rgba(186, 40, 72, 0.14);
  }

  .entry.assistant .entry-body {
    background: var(--ivory);
    border: 1px solid var(--hairline);
    border-left: 3.5px solid var(--gold);
    padding: 18px 22px;
    border-radius: 6px 14px 14px 14px;
    font-size: 0.96rem;
    line-height: 1.68;
    color: var(--ink);
  }

  .entry-actions {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--crimson);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }

  .copy-btn:hover {
    text-decoration: underline;
  }

  /* Rich Tables & Lists inside Responses */
  .entry-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 0.88rem;
    background: #FFFFFF;
    border-radius: 8px;
    overflow: hidden;
  }

  .entry-body th,
  .entry-body td {
    border: 1px solid #E2CCB3;
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
  }

  .entry-body th {
    background: var(--sand);
    font-weight: 700;
    color: var(--ink);
  }

  .entry-body ul,
  .entry-body ol {
    margin: 8px 0 8px 22px;
  }

  .entry-body li {
    margin-bottom: 5px;
  }

  .entry-body h2,
  .entry-body h3,
  .entry-body h4 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--crimson);
    margin: 14px 0 6px 0;
    font-size: 1.2rem;
  }

  /* Starter Prompt Pills */
  .starter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .starter-pill {
    background: #FFFFFF;
    border: 1px solid #DEC7B0;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .starter-pill:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: #FFFDF9;
  }

  /* Spacious Typing Area */
  .composer-box {
    padding: 16px 24px 18px 24px;
    background: var(--ivory);
    border-top: 1px solid var(--hairline);
  }

  .composer-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .composer-row textarea {
    flex: 1;
    min-height: 82px;
    max-height: 220px;
    resize: vertical;
    padding: 14px 16px;
    border: 1.5px solid #D5BCA3;
    border-radius: 12px;
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  .composer-row textarea:focus {
    outline: none;
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px rgba(186, 40, 72, 0.10);
  }

  .btn-send {
    flex-shrink: 0;
    height: 48px;
    padding: 0 24px;
    background: var(--crimson);
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-send:hover:not(:disabled) {
    background: var(--crimson-dark);
  }

  .btn-send:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .composer-note {
    margin-top: 7px;
    font-size: 0.75rem;
    color: var(--ink-muted);
  }

  /* 4. Brand Kit v4 Sand Footer (#F8E8D4) — 100% Straight Top Edge + Auto & House Mascot Scene */
  .brand-footer {
    background: var(--sand);
    border-top: 2px solid #E5CEB5;
    padding: 14px 24px 0 24px;
    margin-top: auto;
    flex-shrink: 0;
  }

  .footer-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .footer-brand {
    padding-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .footer-brand-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .footer-domain {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--crimson);
  }

  .footer-sub {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--ink);
  }

  .footer-meta {
    font-size: 0.75rem;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .mascot-stage {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    overflow: hidden;
  }

  .mascot-stage svg {
    display: block;
    max-width: 100%;
    height: auto;
  }

  @media (max-width: 680px) {
    .workspace-wrap { padding: 12px; }
    .chat-stream { padding: 16px; }
    .composer-row { flex-direction: column; align-items: stretch; }
    .btn-send { width: 100%; }
    .footer-inner { flex-direction: column; align-items: center; text-align: center; }
    .footer-brand-row { justify-content: center; }
  }
</style>

<script>
let chatHistory = [];
let isBusy = false;

function initChat() {
  const stream = document.getElementById("chatStream");
  stream.innerHTML = `
    <div class="entry assistant">
      <div class="entry-body">
        <strong>Namaste!</strong> How can I help you today?
        <div class="starter-row">
          <button type="button" class="starter-pill" onclick="useStarter('List all Puja packages and exact offerings in a table')">Puja Offerings Table</button>
          <button type="button" class="starter-pill" onclick="useStarter('Draft a ready-to-send WhatsApp quote for Satyanarayan Katha including customer-owned utensils')">WhatsApp Puja Quote</button>
          <button type="button" class="starter-pill" onclick="useStarter('Summarize recent team updates and flag any missing follow-ups')">Audit Team Logs</button>
        </div>
      </div>
    </div>
  `;
}

function useStarter(text) {
  document.getElementById("qInput").value = text;
  sendMessage();
}

function resetChat() {
  chatHistory = [];
  initChat();
  document.getElementById("qInput").focus();
}

document.getElementById("qInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  if (isBusy) return;
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if (!q) { input.focus(); return; }

  const scriptUrl = getScriptUrl();
  if (!scriptUrl) {
    appendEntry("assistant", "⚠️ **DEFAULT_SCRIPT_URL** is missing in `brain.js` on GitHub.");
    return;
  }

  input.value = "";
  chatHistory.push({ role: "user", content: q });
  appendEntry("user", q);

  isBusy = true;
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  btn.textContent = "Thinking...";

  const typingId = "typing_" + Date.now();
  appendEntry("assistant", "Thinking...", typingId);

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({
        action: "chat",
        history: chatHistory
      })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      replaceEntry(typingId, "⚠️ Backend returned HTML instead of JSON. Ensure Apps Script is deployed with **Who has access: Anyone**.");
      isBusy = false;
      btn.disabled = false;
      btn.textContent = "Send ↵";
      return;
    }

    const reply = (data.answer && data.answer.trim()) ? data.answer.trim() : ("⚠️ Unexpected response: " + raw);
    chatHistory.push({ role: "assistant", content: reply });
    replaceEntry(typingId, reply, true);
  } catch (err) {
    replaceEntry(typingId, "⚠️ Network error: " + err.message);
  }

  isBusy = false;
  btn.disabled = false;
  btn.textContent = "Send ↵";
  input.focus();
}

function appendEntry(role, text, id) {
  const stream = document.getElementById("chatStream");
  const entry = document.createElement("div");
  entry.className = "entry " + role;
  if (id) entry.id = id;

  const body = document.createElement("div");
  body.className = "entry-body";
  body.innerHTML = role === "user" ? escapeHtml(text).replace(/\n/g, "<br>") : renderMarkdown(text);
  entry.appendChild(body);

  if (role === "assistant" && !id) {
    entry.appendChild(buildActions(text));
  }

  stream.appendChild(entry);
  stream.scrollTop = stream.scrollHeight;
}

function replaceEntry(id, text, showCopy) {
  const entry = document.getElementById(id);
  if (!entry) return;
  entry.removeAttribute("id");
  const body = entry.querySelector(".entry-body");
  body.innerHTML = renderMarkdown(text);
  if (showCopy) {
    entry.appendChild(buildActions(text));
  }
  const stream = document.getElementById("chatStream");
  stream.scrollTop = stream.scrollHeight;
}

function buildActions(rawText) {
  const bar = document.createElement("div");
  bar.className = "entry-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy-btn";
  copyBtn.textContent = "Copy response";
  copyBtn.onclick = function() {
    navigator.clipboard.writeText(rawText);
    copyBtn.textContent = "Copied ✓";
    setTimeout(() => copyBtn.textContent = "Copy response", 1800);
  };
  bar.appendChild(copyBtn);
  return bar;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) continue;

      if (!inTable) {
        html += "<table><thead><tr>" + cells.map(c => "<th>" + inlineFormat(c) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => "<td>" + inlineFormat(c) + "</td>").join("") + "</tr>";
      }
      continue;
    } else if (inTable) {
      html += "</tbody></table>";
      inTable = false;
    }

    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineFormat(line.replace(/^[-*•]\s+/, "")) + "</li>";
      continue;
    } else if (inList) {
      html += "</ul>";
      inList = false;
    }

    if (line.startsWith("### ")) {
      html += "<h4>" + inlineFormat(line.slice(4)) + "</h4>";
    } else if (line.startsWith("## ")) {
      html += "<h3>" + inlineFormat(line.slice(3)) + "</h3>";
    } else if (line.startsWith("# ")) {
      html += "<h2>" + inlineFormat(line.slice(2)) + "</h2>";
    } else if (line === "---") {
      html += "<hr style='border:none;border-top:1px solid #e6d5c3;margin:10px 0;'>";
    } else if (line.length > 0) {
      html += "<p style='margin:6px 0;'>" + inlineFormat(line) + "</p>";
    }
  }

  if (inTable) html += "</tbody></table>";
  if (inList) html += "</ul>";
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code style='background:#f3e6d8;padding:1px 5px;border-radius:4px;'>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" style="color:#BA2848;font-weight:600;">Open File ↗</a>');
}

initChat();
</script>
