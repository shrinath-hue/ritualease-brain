<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Intelligence — ritualease.com</title>
<link rel="stylesheet" href="styles.css?v=20">
<style>
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .workspace-shell {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
    overflow: hidden;
  }

  .workspace-bar {
    padding: 18px 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .workspace-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.3px;
  }

  .workspace-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }

  .thread-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 4px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* Editorial Turn Styling (Human SaaS, not Chatbot Bubbles) */
  .turn-user {
    align-self: flex-end;
    max-width: 78%;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 13px 18px;
    border-radius: 14px 14px 4px 14px;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.55;
  }

  .turn-assistant {
    width: 100%;
    padding-left: 18px;
    border-left: 2.5px solid var(--crimson);
  }

  .turn-author {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--crimson);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .turn-body {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
  }

  .turn-body p { margin-bottom: 10px; }
  .turn-body p:last-child { margin-bottom: 0; }
  .turn-body h2, .turn-body h3, .turn-body h4 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 600;
    color: var(--ink);
    margin: 16px 0 8px;
  }
  .turn-body ul, .turn-body ol {
    margin: 8px 0 12px 20px;
  }
  .turn-body li { margin-bottom: 5px; }

  .turn-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 13.5px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .turn-body th {
    background: var(--bg-subtle);
    color: var(--ink);
    font-weight: 600;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .turn-body td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .copy-btn:hover { color: var(--crimson); background: var(--bg-subtle); }

  /* Empty State Quick Prompts */
  .empty-state {
    margin: auto 0;
    padding: 24px 0;
  }
  .empty-heading {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-sub {
    color: var(--ink-secondary);
    font-size: 14.5px;
    max-width: 600px;
    margin-bottom: 20px;
  }
  .prompt-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .prompt-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .prompt-card:hover {
    border-color: var(--crimson);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .prompt-card strong {
    display: block;
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .prompt-card span {
    font-size: 12.5px;
    color: var(--ink-secondary);
    line-height: 1.4;
    display: block;
  }

  /* Spacious Docked Composer */
  .composer-dock {
    padding: 14px 0 22px;
    flex-shrink: 0;
    background: var(--bg-canvas);
  }
  .composer-box {
    background: var(--bg-surface);
    border: 1.5px solid var(--border-strong);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow-md);
    transition: border-color 0.15s ease;
  }
  .composer-box:focus-within {
    border-color: var(--crimson);
  }
  .composer-textarea {
    width: 100%;
    min-height: 74px;
    max-height: 220px;
    border: none;
    background: transparent;
    resize: vertical;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    display: block;
  }
  .composer-textarea:focus {
    outline: none;
  }
  .composer-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--bg-subtle);
  }
  .composer-meta {
    font-size: 12px;
    color: var(--ink-muted);
  }

  @media (max-width: 720px) {
    .workspace-shell { padding: 0 14px; }
    .prompt-grid { grid-template-columns: 1fr; }
    .turn-user { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="top-accent"></div>
<nav class="app-navbar">
  <div class="app-navbar-inner">
    <a href="index.html" class="brand-lockup">
      <span class="re-monogram">RE</span>
      <span class="brand-wordmark">ritualease.com</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-item">Daily Update</a>
      <a href="portal2_ask_brain.html" class="nav-item active">Ask Intelligence</a>
      <a href="portal3_admin_brain.html" class="nav-item">Admin & Rules</a>
    </div>
  </div>
</nav>

<div class="workspace-shell">
  <div class="workspace-bar">
    <h1 class="workspace-title">Ask RitualEase</h1>
    <div class="workspace-controls">
      <span class="badge badge-green" id="kbStatus"><span class="status-dot"></span> Connecting...</span>
      <button type="button" class="btn-outline" id="syncBtn" onclick="syncDrive(true)">↻ Sync Drive</button>
      <button type="button" class="btn-outline" onclick="resetChat()">New Thread</button>
    </div>
  </div>

  <div class="thread-scroll" id="chatStream"></div>

  <div class="composer-dock">
    <div class="composer-box">
      <textarea id="qInput" class="composer-textarea" placeholder="Ask across your Drive spreadsheets, Word docs, PDFs, packages, vendors, or daily team logs..."></textarea>
      <div class="composer-footer">
        <span class="composer-meta">Enter to send · Shift + Enter for new line</span>
        <button type="button" class="btn-solid" id="askBtn" onclick="sendMessage()">Send Query</button>
      </div>
    </div>
  </div>
</div>

<script src="brain.js?v=20"></script>
<script>
let chatHistory = [];
let isBusy = false;

function initChat() {
  const stream = document.getElementById("chatStream");
  stream.innerHTML = `
    <div class="empty-state">
      <div class="empty-heading">What would you like to check across RitualEase?</div>
      <p class="empty-sub">Search your uploaded Google Drive spreadsheets, documents, PDFs, and team logs—or ask follow-up questions to structure quotes, tables, and checklists.</p>
      <div class="prompt-grid">
        <button type="button" class="prompt-card" onclick="useStarter('Show all Puja packages and exact offerings from our Drive files in a structured table')">
          <strong>Puja Offerings Matrix</strong>
          <span>Extract exact samagri & offerings across packages</span>
        </button>
        <button type="button" class="prompt-card" onclick="useStarter('Draft a ready-to-send WhatsApp quote for Satyanarayan Katha including customer-owned utensils')">
          <strong>Client WhatsApp Quote</strong>
          <span>Generate quote with customer utensil reminders</span>
        </button>
        <button type="button" class="prompt-card" onclick="useStarter('Audit recent team logs and flag any pending follow-ups or missing return counts')">
          <strong>Operations & Lead Audit</strong>
          <span>Review team logs for missed follow-ups</span>
        </button>
      </div>
    </div>
  `;
}

function useStarter(text) {
  document.getElementById("qInput").value = text;
  sendMessage();
}

function resetChat() {
  chatHistory = [];
  initChat();
  document.getElementById("qInput").focus();
}

document.getElementById("qInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function syncDrive(force) {
  const scriptUrl = getScriptUrl();
  const statusEl = document.getElementById("kbStatus");
  if (!scriptUrl) {
    statusEl.className = "badge badge-amber";
    statusEl.textContent = "Backend URL missing";
    return;
  }
  const syncBtn = document.getElementById("syncBtn");
  syncBtn.disabled = true;
  if (force) statusEl.innerHTML = '<span class="status-dot"></span> Syncing Drive...';

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({ action: "sync" })
    });
    const data = await res.json();
    const match = (data.message || "").match(/(\d+)/);
    statusEl.className = "badge badge-green";
    statusEl.innerHTML = match ? `<span class="status-dot"></span> ${match[1]} Drive Files Indexed` : `<span class="status-dot"></span> Drive Ready`;
  } catch (err) {
    statusEl.className = "badge badge-amber";
    statusEl.textContent = "Check Apps Script Access";
  }
  syncBtn.disabled = false;
}

async function sendMessage() {
  if (isBusy) return;
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if (!q) { input.focus(); return; }

  const scriptUrl = getScriptUrl();
  if (!scriptUrl) return;

  if (chatHistory.length === 0) {
    document.getElementById("chatStream").innerHTML = "";
  }

  input.value = "";
  chatHistory.push({ role: "user", content: q });
  appendUserTurn(q);

  isBusy = true;
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  btn.textContent = "Analyzing...";

  const typingId = "turn_" + Date.now();
  appendAssistantTurn("Reading Drive spreadsheets, documents, and team logs...", typingId, false);

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({ action: "chat", history: chatHistory })
    });
    const raw = await res.text();
    const data = JSON.parse(raw);
    const reply = (data.answer && data.answer.trim()) ? data.answer.trim() : ("Unexpected response: " + raw);

    chatHistory.push({ role: "assistant", content: reply });
    if (data.fileCount !== undefined) {
      document.getElementById("kbStatus").innerHTML = `<span class="status-dot"></span> ${data.fileCount} Drive Files Indexed`;
    }
    replaceAssistantTurn(typingId, reply);
  } catch (err) {
    replaceAssistantTurn(typingId, "Connection error: " + err.message);
  }

  isBusy = false;
  btn.disabled = false;
  btn.textContent = "Send Query";
  input.focus();
}

function appendUserTurn(text) {
  const stream = document.getElementById("chatStream");
  const div = document.createElement("div");
  div.className = "turn-user";
  div.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
  stream.appendChild(div);
  stream.scrollTop = stream.scrollHeight;
}

function appendAssistantTurn(text, id, showCopy) {
  const stream = document.getElementById("chatStream");
  const wrap = document.createElement("div");
  wrap.className = "turn-assistant";
  if (id) wrap.id = id;
  wrap.innerHTML = `
    <div class="turn-author"><span>RitualEase Intelligence</span></div>
    <div class="turn-body">${renderMarkdown(text)}</div>
  `;
  stream.appendChild(wrap);
  stream.scrollTop = stream.scrollHeight;
}

function replaceAssistantTurn(id, rawText) {
  const wrap = document.getElementById(id);
  if (!wrap) return;
  wrap.removeAttribute("id");

  const authorBar = wrap.querySelector(".turn-author");
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy-btn";
  copyBtn.textContent = "Copy";
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(rawText);
    copyBtn.textContent = "Copied ✓";
    setTimeout(() => copyBtn.textContent = "Copy", 1800);
  };
  authorBar.appendChild(copyBtn);

  wrap.querySelector(".turn-body").innerHTML = renderMarkdown(rawText);
  const stream = document.getElementById("chatStream");
  stream.scrollTop = stream.scrollHeight;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) continue;
      if (!inTable) {
        html += "<table><thead><tr>" + cells.map(c => "<th>" + inlineFormat(c) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => "<td>" + inlineFormat(c) + "</td>").join("") + "</tr>";
      }
      continue;
    } else if (inTable) {
      html += "</tbody></table>";
      inTable = false;
    }

    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineFormat(line.replace(/^[-*•]\s+/, "")) + "</li>";
      continue;
    } else if (inList) {
      html += "</ul>";
      inList = false;
    }

    if (line.startsWith("### ")) html += "<h4>" + inlineFormat(line.slice(4)) + "</h4>";
    else if (line.startsWith("## ")) html += "<h3>" + inlineFormat(line.slice(3)) + "</h3>";
    else if (line.startsWith("# ")) html += "<h2>" + inlineFormat(line.slice(2)) + "</h2>";
    else if (line === "---") html += "<hr style='border:none;border-top:1px solid var(--border);margin:14px 0;'>";
    else if (line.length > 0) html += "<p>" + inlineFormat(line) + "</p>";
  }

  if (inTable) html += "</tbody></table>";
  if (inList) html += "</ul>";
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code style='background:var(--bg-subtle);padding:2px 6px;border-radius:4px;font-size:13px;'>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" style="color:var(--crimson);font-weight:600;text-decoration:none;border-bottom:1px solid var(--crimson);">Open Source ↗</a>');
}

initChat();
window.addEventListener("DOMContentLoaded", () => syncDrive(false));
</script>
</body>
</html>
