<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask RitualEase — ritualease.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #BA2848;
    --crimson-dark: #961d38;
    --ivory: #FFF8EF;
    --sand: #F8E8D4;
    --gold: #EBAA32;
    --ink: #38272A;
    --ink-muted: #755E62;
    --hairline: #E6D5C3;
    --card-bg: #FFFFFF;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--ivory);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* 1. Top Crimson Accent Bar */
  .top-crimson-bar {
    height: 7px;
    width: 100%;
    background: var(--crimson);
    flex-shrink: 0;
  }

  /* 2. Authentic RitualEase Header (Exact Logo Mark Next to RitualEase Wordmark) */
  .brand-header {
    background: var(--ivory);
    padding: 18px 24px 16px 24px;
    text-align: center;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }

  .logo-lockup {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-decoration: none;
  }

  .logo-mark-img {
    width: 54px;
    height: 54px;
    object-fit: contain;
    display: block;
  }

  .logo-text-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }

  .logo-brand-name {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 800;
    font-size: 1.85rem;
    letter-spacing: -0.025em;
    color: var(--crimson);
    line-height: 1;
  }

  .logo-tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--ink);
    margin-top: 3px;
  }

  /* 3. Clean Editorial Chat Workspace */
  .workspace-wrap {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 20px 24px 20px;
    display: flex;
    flex-direction: column;
  }

  .workspace-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(56, 39, 42, 0.045);
    display: flex;
    flex-direction: column;
    min-height: 490px;
    overflow: hidden;
  }

  .workspace-bar {
    padding: 15px 24px;
    background: var(--ivory);
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .workspace-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink);
    border: none !important;
    text-decoration: none !important;
    line-height: 1.1;
  }

  .btn-new-chat {
    background: #FFFFFF;
    border: 1px solid #D9C3AD;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-new-chat:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: var(--ivory);
  }

  .chat-stream {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #FFFDFB;
  }

  .entry {
    display: flex;
    flex-direction: column;
  }

  .entry.user {
    align-self: flex-end;
    max-width: 80%;
  }

  .entry.assistant {
    align-self: flex-start;
    width: 100%;
  }

  .entry.user .entry-body {
    background: var(--crimson);
    color: #FFFFFF;
    padding: 13px 18px;
    border-radius: 14px 14px 4px 14px;
    font-size: 0.96rem;
    line-height: 1.55;
    box-shadow: 0 3px 10px rgba(186, 40, 72, 0.14);
  }

  .entry.assistant .entry-body {
    background: var(--ivory);
    border: 1px solid var(--hairline);
    border-left: 3.5px solid var(--gold);
    padding: 18px 22px;
    border-radius: 6px 14px 14px 14px;
    font-size: 0.96rem;
    line-height: 1.68;
    color: var(--ink);
  }

  .entry-actions {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--crimson);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }

  .copy-btn:hover {
    text-decoration: underline;
  }

  .entry-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 0.88rem;
    background: #FFFFFF;
  }

  .entry-body th,
  .entry-body td {
    border: 1px solid #E2CCB3;
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
  }

  .entry-body th {
    background: var(--sand);
    font-weight: 700;
    color: var(--ink);
  }

  .entry-body ul,
  .entry-body ol {
    margin: 8px 0 8px 22px;
  }

  .entry-body li {
    margin-bottom: 5px;
  }

  .entry-body h2,
  .entry-body h3,
  .entry-body h4 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--crimson);
    margin: 14px 0 6px 0;
    font-size: 1.2rem;
  }

  .starter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .starter-pill {
    background: #FFFFFF;
    border: 1px solid #DEC7B0;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .starter-pill:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: #FFFDF9;
  }

  .composer-box {
    padding: 16px 24px 18px 24px;
    background: var(--ivory);
    border-top: 1px solid var(--hairline);
  }

  .composer-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .composer-row textarea {
    flex: 1;
    min-height: 82px;
    max-height: 220px;
    resize: vertical;
    padding: 14px 16px;
    border: 1.5px solid #D5BCA3;
    border-radius: 12px;
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  .composer-row textarea:focus {
    outline: none;
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px rgba(186, 40, 72, 0.10);
  }

  .btn-send {
    flex-shrink: 0;
    height: 48px;
    padding: 0 24px;
    background: var(--crimson);
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-send:hover:not(:disabled) {
    background: var(--crimson-dark);
  }

  .btn-send:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .composer-note {
    margin-top: 7px;
    font-size: 0.75rem;
    color: var(--ink-muted);
  }

  /* 4. Choreographed Story Footer:
        LEFT END: Modern 2-Story Contemporary Home
        MIDDLE: Paved Grey Dashed Road
        RIGHT -> LEFT: Exact 3D E-Cargo Auto Drives Down Road -> Stops at Home -> Boy Exits, Door Opens & Takes Boxes In */
  .story-footer {
    background: var(--sand);
    border-top: 2px solid #E5CEB5;
    padding-top: 12px;
    margin-top: auto;
    flex-shrink: 0;
    overflow: hidden;
  }

  .story-stage {
    position: relative;
    max-width: 1120px;
    height: 186px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Paved Grey Dashed Road Across Full Width */
  .paved-road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 26px;
    background: linear-gradient(180deg, #5F5A5C 0%, #484345 100%);
    border-top: 2px solid #7D7679;
  }

  .paved-road::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 11px;
    height: 3px;
    background-image: repeating-linear-gradient(
      to right,
      #F8E8D4 0px,
      #F8E8D4 24px,
      transparent 24px,
      transparent 44px
    );
    animation: roadScrollRightToLeft 15s linear infinite;
  }

  /* LEFT END: 3D-Shaded Modern Contemporary 2-Story Home (Matching Official RitualEase Villa Mascot) */
  .home-actor {
    position: absolute;
    bottom: 18px;
    left: 24px;
    width: 245px;
    height: 162px;
    z-index: 3;
  }

  .house-door-leaf {
    transform-origin: left center;
    animation: doorSwing 15s ease-in-out infinite;
  }

  .door-warm-glow {
    opacity: 0;
    animation: glowPulse 15s ease-in-out infinite;
  }

  /* COORDINATOR BOY: Exits Auto, Walks to House Porch & Carries Boxes Through Open Door */
  .boy-actor {
    position: absolute;
    bottom: 20px;
    left: 310px;
    width: 68px;
    height: 98px;
    z-index: 5;
    opacity: 0;
    animation: boyDeliveryToLeft 15s ease-in-out infinite;
  }

  /* RIGHT -> LEFT: Exact 3D E-Cargo Auto Mascot (100% Unmirrored so RitualEase + RE Logo Read Crisp!) */
  .auto-actor {
    position: absolute;
    bottom: 14px;
    right: 24px;
    width: 176px;
    z-index: 4;
    transform-origin: bottom center;
    animation: autoDriveToHouse 15s cubic-bezier(0.35, 0.05, 0.25, 1) infinite;
  }

  .auto-actor img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 7px 10px rgba(56, 39, 42, 0.24));
    animation: engineIdle 0.42s ease-in-out infinite alternate;
  }

  .footer-bar-bottom {
    background: #EFE0CC;
    border-top: 1px solid #DFC9AF;
    padding: 8px 24px;
  }

  .footer-bar-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-muted);
    flex-wrap: wrap;
    gap: 8px;
  }

  .footer-bar-inner strong {
    color: var(--crimson);
  }

  /* === 15-SECOND CONTINUOUS CHOREOGRAPHY ===
     0% - 35%: Auto drives smoothly from Right end down the road toward the House on the Left
     36% - 42%: Auto brakes gently and parks right outside the house porch
     43% - 52%: Boy steps out from auto carrying stacked celebration boxes; house front door swings open
     53% - 76%: Boy walks boxes up to open front door and carries them inside
     77% - 88%: Door closes warmly; boy walks back to auto
     89% - 100%: Smooth reset for next celebration delivery
  */
  @keyframes autoDriveToHouse {
    0%   { left: calc(100% - 205px); opacity: 0; transform: rotate(0deg); }
    6%   { left: calc(100% - 205px); opacity: 1; transform: rotate(0deg); }
    35%  { left: 285px; opacity: 1; transform: rotate(0deg); }
    38%  { left: 280px; opacity: 1; transform: rotate(-1.5deg); }
    41%  { left: 282px; opacity: 1; transform: rotate(0deg); }
    88%  { left: 282px; opacity: 1; transform: rotate(0deg); }
    95%  { left: 282px; opacity: 0; }
    100% { left: calc(100% - 205px); opacity: 0; }
  }

  @keyframes engineIdle {
    from { transform: translateY(0px); }
    to   { transform: translateY(-1.5px); }
  }

  @keyframes boyDeliveryToLeft {
    0%, 40%  { left: 320px; opacity: 0; transform: scale(0.9) translateY(3px); }
    46%      { left: 300px; opacity: 1; transform: scale(1) translateY(0px); }
    53%      { left: 262px; opacity: 1; transform: translateY(-2px); }
    60%      { left: 224px; opacity: 1; transform: translateY(0px); }
    67%      { left: 192px; opacity: 1; transform: translateY(-2px); }
    77%      { left: 192px; opacity: 1; transform: translateY(0px); }
    85%      { left: 295px; opacity: 1; transform: translateY(0px); }
    90%, 100%{ left: 320px; opacity: 0; }
  }

  @keyframes doorSwing {
    0%, 45%  { transform: scaleX(1); }
    53%, 80% { transform: scaleX(0.20); }
    87%, 100%{ transform: scaleX(1); }
  }

  @keyframes glowPulse {
    0%, 45%  { opacity: 0; }
    53%, 80% { opacity: 1; }
    87%, 100%{ opacity: 0; }
  }

  @keyframes roadScrollRightToLeft {
    0%   { background-position-x: 0px; }
    37%  { background-position-x: 240px; }
    88%  { background-position-x: 240px; }
    100% { background-position-x: 280px; }
  }

  @media (max-width: 720px) {
    .workspace-wrap { padding: 12px; }
    .chat-stream { padding: 16px; }
    .composer-row { flex-direction: column; align-items: stretch; }
    .btn-send { width: 100%; }
    .story-stage { height: 150px; }
    .home-actor { width: 175px; height: 118px; left: 10px; }
    .auto-actor { width: 132px; }
    @keyframes autoDriveToHouse {
      0%   { left: calc(100% - 142px); opacity: 0; }
      6%   { left: calc(100% - 142px); opacity: 1; }
      37%, 88% { left: 195px; opacity: 1; }
      95%, 100%{ left: calc(100% - 142px); opacity: 0; }
    }
    @keyframes boyDeliveryToLeft {
      0%, 40%  { left: 215px; opacity: 0; }
      47%      { left: 195px; opacity: 1; }
      66%, 77% { left: 132px; opacity: 1; }
      88%, 100%{ left: 215px; opacity: 0; }
    }
  }
</style>
</head>
<body>

  <!-- Top Crimson Accent Strip -->
  <div class="top-crimson-bar"></div>

  <!-- Official RitualEase Header Using Exact Logo Mark Next to RitualEase Name -->
  <header class="brand-header">
    <div class="logo-lockup">
      <img src="ritualease-logo-mark-1024-transparent.png" alt="RitualEase" class="logo-mark-img">
      <div class="logo-text-stack">
        <span class="logo-brand-name">RitualEase</span>
        <span class="logo-tagline">Celebrations, delivered at home</span>
      </div>
    </div>
  </header>

  <!-- Continuous Conversation Workspace -->
  <main class="workspace-wrap">
    <div class="workspace-card">
      <div class="workspace-bar">
        <div class="workspace-title">Ask RitualEase</div>
        <button type="button" class="btn-new-chat" onclick="resetChat()">+ New Chat</button>
      </div>

      <div class="chat-stream" id="chatStream"></div>

      <div class="composer-box">
        <div class="composer-row">
          <textarea id="qInput" rows="3" placeholder="Ask anything across your packages, samagri lists, SOPs, vendors, or daily team logs..."></textarea>
          <button type="button" class="btn-send" id="askBtn" onclick="sendMessage()">Send ↵</button>
        </div>
        <div class="composer-note">Press <strong>Enter</strong> to send • <strong>Shift + Enter</strong> for a new line</div>
      </div>
    </div>
  </main>

  <!-- Choreographed Mascot Story Footer -->
  <footer class="story-footer">
    <div class="story-stage">
      <!-- Paved Dashed Road -->
      <div class="paved-road"></div>

      <!-- 1. LEFT END: 3D-Shaded Contemporary 2-Story Villa Home (Exact RitualEase House Architecture) -->
      <div class="home-actor" aria-hidden="true">
        <svg width="245" height="162" viewBox="0 0 245 162" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="stuccoGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFFDF9"/>
              <stop offset="100%" stop-color="#EAD8C3"/>
            </linearGradient>
            <linearGradient id="cedarGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#A87248"/>
              <stop offset="50%" stop-color="#8F5D38"/>
              <stop offset="100%" stop-color="#76492A"/>
            </linearGradient>
            <linearGradient id="warmWindow" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFF1C2"/>
              <stop offset="100%" stop-color="#F5C76B"/>
            </linearGradient>
            <linearGradient id="doorWood" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#8A5232"/>
              <stop offset="100%" stop-color="#683B21"/>
            </linearGradient>
          </defs>

          <!-- Stone Patio Base -->
          <rect x="8" y="152" width="228" height="8" rx="2" fill="#C9BEB4"/>

          <!-- Upper Story Left: Beige Stucco Balcony Volume -->
          <rect x="18" y="22" width="122" height="58" rx="2" fill="url(#stuccoGrad)" stroke="#5E4942" stroke-width="1.4"/>
          <rect x="12" y="16" width="132" height="7" rx="1.5" fill="#463735"/>
          <!-- Balcony Sliding Glass Door -->
          <rect x="34" y="30" width="88" height="44" rx="2" fill="url(#warmWindow)" stroke="#463735" stroke-width="1.5"/>
          <line x1="78" y1="30" x2="78" y2="74" stroke="#463735" stroke-width="1.6"/>
          <!-- Balcony Palm Planter -->
          <rect x="22" y="61" width="10" height="13" rx="1.5" fill="#FFFFFF" stroke="#8C7B75" stroke-width="1"/>
          <path d="M27 61C22 52 17 51 15 54M27 61C25 49 28 46 31 48M27 61C33 52 38 52 39 55" stroke="#3F6E3E" stroke-width="2.4" stroke-linecap="round"/>
          <!-- Glass Balcony Balustrade -->
          <rect x="16" y="58" width="122" height="18" fill="rgba(220, 238, 242, 0.45)" stroke="#5E4942" stroke-width="1.2"/>
          <line x1="16" y1="58" x2="138" y2="58" stroke="#463735" stroke-width="2"/>

          <!-- Upper Story Right: Vertical Teakwood Slatted Tower -->
          <rect x="140" y="10" width="88" height="70" rx="2" fill="url(#cedarGrad)" stroke="#463735" stroke-width="1.4"/>
          <rect x="136" y="5" width="96" height="6" rx="1.5" fill="#38272A"/>
          <!-- Vertical Wood Slat Lines -->
          <line x1="150" y1="11" x2="150" y2="80" stroke="#5E391F" stroke-width="1"/>
          <line x1="218" y1="11" x2="218" y2="80" stroke="#5E391F" stroke-width="1"/>
          <!-- Large Picture Window -->
          <rect x="156" y="20" width="56" height="46" rx="2" fill="url(#warmWindow)" stroke="#38272A" stroke-width="2.2"/>
          <line x1="184" y1="20" x2="184" y2="66" stroke="#38272A" stroke-width="1.6"/>

          <!-- Ground Story Main Structure -->
          <rect x="14" y="80" width="214" height="72" rx="2" fill="url(#stuccoGrad)" stroke="#5E4942" stroke-width="1.5"/>
          <!-- Deep Porch Ceiling Soffit with Warm Spotlights -->
          <rect x="10" y="77" width="222" height="7" rx="1.5" fill="#5A3A28"/>
          <circle cx="52" cy="85" r="2.2" fill="#FFF3C4"/>
          <circle cx="118" cy="85" r="2.2" fill="#FFF3C4"/>
          <circle cx="184" cy="85" r="2.2" fill="#FFF3C4"/>

          <!-- Left Ground Glass Patio Doors -->
          <rect x="26" y="92" width="74" height="60" rx="2" fill="url(#warmWindow)" stroke="#463735" stroke-width="1.6"/>
          <line x1="63" y1="92" x2="63" y2="152" stroke="#463735" stroke-width="1.6"/>

          <!-- Right Ground Main Entrance Porch + Animated Swinging Teak Door -->
          <rect x="142" y="92" width="44" height="60" rx="2" fill="#FFF3D1" stroke="#38272A" stroke-width="1.8"/>
          <rect class="door-warm-glow" x="143" y="93" width="42" height="58" fill="#EBAA32" opacity="0.5"/>
          <!-- Animated Teak Front Door Leaf -->
          <g transform="translate(143, 93)">
            <g class="house-door-leaf">
              <rect x="0" y="0" width="42" height="58" fill="url(#doorWood)" stroke="#38272A" stroke-width="1.4"/>
              <line x1="21" y1="2" x2="21" y2="56" stroke="#4E2B16" stroke-width="1.2"/>
              <line x1="35" y1="22" x2="35" y2="36" stroke="#E6D5C3" stroke-width="2.2" stroke-linecap="round"/>
            </g>
          </g>
          <!-- Warm Porch Sconce Lights Flanking Door -->
          <rect x="133" y="106" width="4" height="10" rx="1" fill="#EBAA32"/>
          <rect x="191" y="106" width="4" height="10" rx="1" fill="#EBAA32"/>

          <!-- Two White Cylindrical Planters with Lush Green Shrubs Flanking Entrance -->
          <rect x="122" y="136" width="14" height="16" rx="2" fill="#FFFFFF" stroke="#9E8E87" stroke-width="1.2"/>
          <circle cx="129" cy="130" r="9.5" fill="#467542"/>
          <circle cx="126" cy="127" r="5" fill="#5D9158"/>

          <rect x="192" y="136" width="14" height="16" rx="2" fill="#FFFFFF" stroke="#9E8E87" stroke-width="1.2"/>
          <circle cx="199" cy="130" r="9.5" fill="#467542"/>
          <circle cx="202" cy="127" r="5" fill="#5D9158"/>
        </svg>
      </div>

      <!-- 2. COORDINATOR BOY: Steps Out of Auto Carrying Celebration Boxes Toward House -->
      <div class="boy-actor" aria-hidden="true">
        <svg width="68" height="98" viewBox="0 0 68 98" fill="none" xmlns="http://www.w3.org/2000/svg">

<script src="brain.js?v=14"></script>
<script>
let chatHistory = [];
let isBusy = false;

function initChat() {
  const stream = document.getElementById("chatStream");
  stream.innerHTML = `
    <div class="entry assistant">
      <div class="entry-body">
        <strong>Namaste!</strong> How can I help you today?
        <div class="starter-row">
          <button type="button" class="starter-pill" onclick="useStarter('List all Puja packages and exact offerings in a table')">Puja Offerings Table</button>
          <button type="button" class="starter-pill" onclick="useStarter('Draft a ready-to-send WhatsApp quote for Satyanarayan Katha including customer-owned utensils')">WhatsApp Puja Quote</button>
          <button type="button" class="starter-pill" onclick="useStarter('Summarize recent team updates and flag any missing follow-ups')">Audit Team Logs</button>
        </div>
      </div>
    </div>
  `;
}

function useStarter(text) {
  document.getElementById("qInput").value = text;
  sendMessage();
}

function resetChat() {
  chatHistory = [];
  initChat();
  document.getElementById("qInput").focus();
}

document.getElementById("qInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  if (isBusy) return;
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if (!q) { input.focus(); return; }

  const scriptUrl = getScriptUrl();
  if (!scriptUrl) {
    appendEntry("assistant", "⚠️ **DEFAULT_SCRIPT_URL** is missing in `brain.js` on GitHub.");
    return;
  }

  input.value = "";
  chatHistory.push({ role: "user", content: q });
  appendEntry("user", q);

  isBusy = true;
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  btn.textContent = "Thinking...";

  const typingId = "typing_" + Date.now();
  appendEntry("assistant", "Thinking...", typingId);

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({
        action: "chat",
        history: chatHistory
      })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      replaceEntry(typingId, "⚠️ Backend returned HTML instead of JSON. Ensure Apps Script is deployed with **Who has access: Anyone**.");
      isBusy = false;
      btn.disabled = false;
      btn.textContent = "Send ↵";
      return;
    }

    const reply = (data.answer && data.answer.trim()) ? data.answer.trim() : ("⚠️ Unexpected response: " + raw);
    chatHistory.push({ role: "assistant", content: reply });
    replaceEntry(typingId, reply, true);
  } catch (err) {
    replaceEntry(typingId, "⚠️ Network error: " + err.message);
  }

  isBusy = false;
  btn.disabled = false;
  btn.textContent = "Send ↵";
  input.focus();
}

function appendEntry(role, text, id) {
  const stream = document.getElementById("chatStream");
  const entry = document.createElement("div");
  entry.className = "entry " + role;
  if (id) entry.id = id;

  const body = document.createElement("div");
  body.className = "entry-body";
  body.innerHTML = role === "user" ? escapeHtml(text).replace(/\n/g, "<br>") : renderMarkdown(text);
  entry.appendChild(body);

  if (role === "assistant" && !id) {
    entry.appendChild(buildActions(text));
  }

  stream.appendChild(entry);
  stream.scrollTop = stream.scrollHeight;
}

function replaceEntry(id, text, showCopy) {
  const entry = document.getElementById(id);
  if (!entry) return;
  entry.removeAttribute("id");
  const body = entry.querySelector(".entry-body");
  body.innerHTML = renderMarkdown(text);
  if (showCopy) {
    entry.appendChild(buildActions(text));
  }
  const stream = document.getElementById("chatStream");
  stream.scrollTop = stream.scrollHeight;
}

function buildActions(rawText) {
  const bar = document.createElement("div");
  bar.className = "entry-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy-btn";
  copyBtn.textContent = "Copy response";
  copyBtn.onclick = function() {
    navigator.clipboard.writeText(rawText);
    copyBtn.textContent = "Copied ✓";
    setTimeout(() => copyBtn.textContent = "Copy response", 1800);
  };
  bar.appendChild(copyBtn);
  return bar;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) continue;

      if (!inTable) {
        html += "<table><thead><tr>" + cells.map(c => "<th>" + inlineFormat(c) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => "<td>" + inlineFormat(c) + "</td>").join("") + "</tr>";
      }
      continue;
    } else if (inTable) {
      html += "</tbody></table>";
      inTable = false;
    }

    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineFormat(line.replace(/^[-*•]\s+/, "")) + "</li>";
      continue;
    } else if (inList) {
      html += "</ul>";
      inList = false;
    }

    if (line.startsWith("### ")) {
      html += "<h4>" + inlineFormat(line.slice(4)) + "</h4>";
    } else if (line.startsWith("## ")) {
      html += "<h3>" + inlineFormat(line.slice(3)) + "</h3>";
    } else if (line.startsWith("# ")) {
      html += "<h2>" + inlineFormat(line.slice(2)) + "</h2>";
    } else if (line === "---") {
      html += "<hr style='border:none;border-top:1px solid #e6d5c3;margin:10px 0;'>";
    } else if (line.length > 0) {
      html += "<p style='margin:6px 0;'>" + inlineFormat(line) + "</p>";
    }
  }

  if (inTable) html += "</tbody></table>";
  if (inList) html += "</ul>";
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code style='background:#f3e6d8;padding:1px 5px;border-radius:4px;'>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" style="color:#BA2848;font-weight:600;">Open File ↗</a>');
}

initChat();
</script>
