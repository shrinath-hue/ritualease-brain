<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask RitualEase — ritualease.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #BA2848;
    --crimson-dark: #961d38;
    --ivory: #FFF8EF;
    --sand: #F8E8D4;
    --gold: #EBAA32;
    --ink: #38272A;
    --ink-muted: #755E62;
    --hairline: #E6D5C3;
    --card-bg: #FFFFFF;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--ivory);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* 1. Top Crimson Accent Bar */
  .top-crimson-bar {
    height: 7px;
    width: 100%;
    background: var(--crimson);
    flex-shrink: 0;
  }

  /* 2. Authentic RitualEase Header Using Exact Logo Mark & Wordmark */
  .brand-header {
    background: var(--ivory);
    padding: 18px 24px 16px 24px;
    text-align: center;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }

  .logo-lockup {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-decoration: none;
  }

  .logo-mark-img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    display: block;
  }

  .logo-text-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }

  .logo-brand-name {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 800;
    font-size: 1.75rem;
    letter-spacing: -0.025em;
    color: var(--crimson);
    line-height: 1;
  }

  .logo-domain-pill {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  .logo-tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 0.98rem;
    color: var(--ink);
    margin-top: 1px;
  }

  /* 3. Clean Editorial Chat Workspace */
  .workspace-wrap {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 20px 24px 20px;
    display: flex;
    flex-direction: column;
  }

  .workspace-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(56, 39, 42, 0.045);
    display: flex;
    flex-direction: column;
    min-height: 500px;
    overflow: hidden;
  }

  .workspace-bar {
    padding: 15px 24px;
    background: var(--ivory);
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .workspace-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink);
    border: none !important;
    text-decoration: none !important;
    line-height: 1.1;
  }

  .btn-new-chat {
    background: #FFFFFF;
    border: 1px solid #D9C3AD;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-new-chat:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: var(--ivory);
  }

  .chat-stream {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #FFFDFB;
  }

  .entry {
    display: flex;
    flex-direction: column;
  }

  .entry.user {
    align-self: flex-end;
    max-width: 80%;
  }

  .entry.assistant {
    align-self: flex-start;
    width: 100%;
  }

  .entry.user .entry-body {
    background: var(--crimson);
    color: #FFFFFF;
    padding: 13px 18px;
    border-radius: 14px 14px 4px 14px;
    font-size: 0.96rem;
    line-height: 1.55;
    box-shadow: 0 3px 10px rgba(186, 40, 72, 0.14);
  }

  .entry.assistant .entry-body {
    background: var(--ivory);
    border: 1px solid var(--hairline);
    border-left: 3.5px solid var(--gold);
    padding: 18px 22px;
    border-radius: 6px 14px 14px 14px;
    font-size: 0.96rem;
    line-height: 1.68;
    color: var(--ink);
  }

  .entry-actions {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--crimson);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }

  .copy-btn:hover {
    text-decoration: underline;
  }

  .entry-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 0.88rem;
    background: #FFFFFF;
  }

  .entry-body th,
  .entry-body td {
    border: 1px solid #E2CCB3;
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
  }

  .entry-body th {
    background: var(--sand);
    font-weight: 700;
    color: var(--ink);
  }

  .entry-body ul,
  .entry-body ol {
    margin: 8px 0 8px 22px;
  }

  .entry-body li {
    margin-bottom: 5px;
  }

  .entry-body h2,
  .entry-body h3,
  .entry-body h4 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--crimson);
    margin: 14px 0 6px 0;
    font-size: 1.2rem;
  }

  .starter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .starter-pill {
    background: #FFFFFF;
    border: 1px solid #DEC7B0;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .starter-pill:hover {
    border-color: var(--crimson);
    color: var(--crimson);
    background: #FFFDF9;
  }

  .composer-box {
    padding: 16px 24px 18px 24px;
    background: var(--ivory);
    border-top: 1px solid var(--hairline);
  }

  .composer-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .composer-row textarea {
    flex: 1;
    min-height: 82px;
    max-height: 220px;
    resize: vertical;
    padding: 14px 16px;
    border: 1.5px solid #D5BCA3;
    border-radius: 12px;
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  .composer-row textarea:focus {
    outline: none;
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px rgba(186, 40, 72, 0.10);
  }

  .btn-send {
    flex-shrink: 0;
    height: 48px;
    padding: 0 24px;
    background: var(--crimson);
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-send:hover:not(:disabled) {
    background: var(--crimson-dark);
  }

  .btn-send:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .composer-note {
    margin-top: 7px;
    font-size: 0.75rem;
    color: var(--ink-muted);
  }

  /* 4. Choreographed Story Footer: Auto Drives Down Road -> Stops at Home -> Boy Exits, Opens Door & Delivers Boxes */
  .story-footer {
    background: var(--sand);
    border-top: 2px solid #E5CEB5;
    padding-top: 14px;
    margin-top: auto;
    flex-shrink: 0;
    overflow: hidden;
  }

  .story-stage {
    position: relative;
    max-width: 1120px;
    height: 168px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Paved Grey Dashed Road Running End-to-End */
  .paved-road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 24px;
    background: #524D4F;
    border-top: 2px solid #756F72;
  }

  .paved-road::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 10px;
    height: 3px;
    background-image: repeating-linear-gradient(
      to right,
      #F8E8D4 0px,
      #F8E8D4 22px,
      transparent 22px,
      transparent 40px
    );
    animation: roadScroll 14s linear infinite;
  }

  /* Real 3D E-Cargo Auto Mascot Driving Left-to-Right Toward Home */
  .auto-actor {
    position: absolute;
    bottom: 14px;
    left: 24px;
    width: 158px;
    z-index: 4;
    transform-origin: bottom center;
    animation: autoJourney 14s cubic-bezier(0.35, 0.05, 0.25, 1) infinite;
  }

  /* Flip horizontal so front cabin faces right toward the home, while keeping crisp shadow */
  .auto-actor img {
    width: 100%;
    height: auto;
    display: block;
    transform: scaleX(-1);
    filter: drop-shadow(0 6px 8px rgba(56, 39, 42, 0.22));
    animation: engineIdle 0.45s ease-in-out infinite alternate;
  }

  /* Coordinator Character Exiting Auto & Carrying Celebration Boxes to House */
  .boy-actor {
    position: absolute;
    bottom: 18px;
    left: 55%;
    width: 64px;
    height: 92px;
    z-index: 5;
    opacity: 0;
    animation: boyDelivery 14s ease-in-out infinite;
  }

  /* Modern 2-Story Home at the Right End of the Road */
  .home-actor {
    position: absolute;
    bottom: 18px;
    right: 28px;
    width: 215px;
    height: 142px;
    z-index: 3;
  }

  /* Animated Front Door on the Home */
  .house-door-leaf {
    transform-origin: left center;
    animation: doorSwing 14s ease-in-out infinite;
  }

  /* Warm Interior Glow When Door Opens */
  .door-warm-glow {
    opacity: 0;
    animation: glowPulse 14s ease-in-out infinite;
  }

  /* Footer Brand Signature Strip Beneath Road */
  .footer-bar-bottom {
    background: #EFE0CC;
    border-top: 1px solid #DFC9AF;
    padding: 8px 24px;
  }

  .footer-bar-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-muted);
    flex-wrap: wrap;
    gap: 8px;
  }

  .footer-bar-inner strong {
    color: var(--crimson);
  }

  /* === 14-SECOND CONTINUOUS CHOREOGRAPHY KEYFRAMES ===
     0% - 34%: Auto drives smoothly from left end down the road toward the house
     35% - 42%: Auto brakes gently & parks right outside the home
     43% - 52%: Boy steps out of auto holding gold/ivory celebration boxes; house front door swings open
     53% - 76%: Boy walks boxes up to open front door & hands them inside
     77% - 88%: Door closes warmly; boy steps back into auto
     89% - 100%: Smooth reset for next celebration delivery
  */
  @keyframes autoJourney {
    0%   { left: 24px; opacity: 0; transform: translateY(0); }
    6%   { left: 24px; opacity: 1; transform: translateY(0); }
    36%  { left: calc(100% - 415px); opacity: 1; transform: translateY(0); }
    39%  { left: calc(100% - 410px); opacity: 1; transform: rotate(1.5deg); }
    42%  { left: calc(100% - 412px); opacity: 1; transform: rotate(0deg); }
    88%  { left: calc(100% - 412px); opacity: 1; transform: rotate(0deg); }
    95%  { left: calc(100% - 412px); opacity: 0; }
    100% { left: 24px; opacity: 0; }
  }

  @keyframes engineIdle {
    from { transform: scaleX(-1) translateY(0px); }
    to   { transform: scaleX(-1) translateY(-1.5px); }
  }

  @keyframes boyDelivery {
    0%, 41%  { left: calc(100% - 310px); opacity: 0; transform: scale(0.88) translateY(4px); }
    47%      { left: calc(100% - 295px); opacity: 1; transform: scale(1) translateY(0px); }
    54%      { left: calc(100% - 265px); opacity: 1; transform: translateY(-2px); }
    61%      { left: calc(100% - 235px); opacity: 1; transform: translateY(0px); }
    68%      { left: calc(100% - 210px); opacity: 1; transform: translateY(-2px); }
    78%      { left: calc(100% - 210px); opacity: 1; transform: translateY(0px); }
    86%      { left: calc(100% - 285px); opacity: 1; transform: translateY(0px); }
    91%, 100%{ left: calc(100% - 310px); opacity: 0; }
  }

  @keyframes doorSwing {
    0%, 46%  { transform: scaleX(1); }
    54%, 80% { transform: scaleX(0.22); }
    87%, 100%{ transform: scaleX(1); }
  }

  @keyframes glowPulse {
    0%, 46%  { opacity: 0; }
    54%, 80% { opacity: 1; }
    87%, 100%{ opacity: 0; }
  }

  @keyframes roadScroll {
    0%   { background-position-x: 0px; }
    38%  { background-position-x: -240px; }
    88%  { background-position-x: -240px; }
    100% { background-position-x: -280px; }
  }

  @media (max-width: 720px) {
    .workspace-wrap { padding: 12px; }
    .chat-stream { padding: 16px; }
    .composer-row { flex-direction: column; align-items: stretch; }
    .btn-send { width: 100%; }
    .story-stage { height: 140px; }
    .auto-actor { width: 120px; }
    .home-actor { width: 165px; height: 112px; right: 12px; }
    @keyframes autoJourney {
      0%   { left: 10px; opacity: 0; }
      6%   { left: 10px; opacity: 1; }
      38%, 88% { left: calc(100% - 305px); opacity: 1; }
      95%, 100%{ left: 10px; opacity: 0; }
    }
    @keyframes boyDelivery {
      0%, 41%  { left: calc(100% - 215px); opacity: 0; }
      48%      { left: calc(100% - 200px); opacity: 1; }
      66%, 78% { left: calc(100% - 155px); opacity: 1; }
      88%, 100%{ left: calc(100% - 215px); opacity: 0; }
    }
  }
</style>
</head>
<body>

  <!-- Top Crimson Accent Strip -->
  <div class="top-crimson-bar"></div>

  <!-- Official RitualEase Header Using Exact Logo Mark & Wordmark -->
  <header class="brand-header">
    <div class="logo-lockup">
      <img src="ritualease-logo-mark-1024-transparent.png" alt="RitualEase Logo" class="logo-mark-img" onerror="this.style.display='none'">
      <div class="logo-text-stack">
        <span class="logo-brand-name">RitualEase</span>
        <span class="logo-tagline">Celebrations, delivered at home</span>
      </div>
    </div>
  </header>

  <!-- Continuous Conversation Workspace -->
  <main class="workspace-wrap">
    <div class="workspace-card">
      <div class="workspace-bar">
        <div class="workspace-title">Ask RitualEase</div>
        <button type="button" class="btn-new-chat" onclick="resetChat()">+ New Chat</button>
      </div>

      <div class="chat-stream" id="chatStream"></div>

      <div class="composer-box">
        <div class="composer-row">
          <textarea id="qInput" rows="3" placeholder="Ask anything across your packages, samagri lists, SOPs, vendors, or daily team logs..."></textarea>
          <button type="button" class="btn-send" id="askBtn" onclick="sendMessage()">Send ↵</button>
        </div>
        <div class="composer-note">Press <strong>Enter</strong> to send • <strong>Shift + Enter</strong> for a new line</div>
      </div>
    </div>
  </main>

  <!-- Animated Mascot Story Footer: Auto Drives Along Road -> Stops at House -> Boy Exits, Opens Door & Delivers Boxes -->
  <footer class="story-footer">
    <div class="story-stage">
      <!-- Paved Dashed Road -->
      <div class="paved-road"></div>

      <!-- 1. Exact 3D E-Cargo Auto Mascot Driving Left-to-Right -->
      <div class="auto-actor">
        <img src="auto_plain_HQ_with-RE-logo.png" alt="RitualEase E-Cargo Auto">
      </div>

      <!-- 2. RitualEase Coordinator Exiting Auto Carrying Stacked Celebration Boxes -->
      <div class="boy-actor" aria-hidden="true">
        <svg width="64" height="92" viewBox="0 0 64 92" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ground Shadow -->
          <ellipse cx="30" cy="89" rx="16" ry="3.5" fill="rgba(56,39,42,0.22)"/>
          <!-- White Cap with Crimson Visor -->
          <path d="M16 20C16 13 21 9 28 9C35 9 40 13 40 20H16Z" fill="#FFFFFF" stroke="#38272A" stroke-width="1.5"/>
          <path d="M28 19H46" stroke="#BA2848" stroke-width="3" stroke-linecap="round"/>
          <!-- Head & Smile -->
          <circle cx="28" cy="27" r="8.5" fill="#F2C39B"/>
          <circle cx="31" cy="26" r="1.2" fill="#38272A"/>
          <path d="M28 30C30 31.5 32.5 31.2 33.5 29.8" stroke="#38272A" stroke-width="1.3" stroke-linecap="round"/>
          <!-- Crimson RitualEase Polo Shirt -->
          <path d="M17 37C17 35 21 34 28 34C35 34 39 35 39 37L41 61H15L17 37Z" fill="#BA2848"/>
          <!-- Trousers & Sneakers -->
          <rect x="18" y="61" width="8.5" height="23" rx="2.5" fill="#38272A"/>
          <rect x="29.5" y="61" width="8.5" height="23" rx="2.5" fill="#38272A"/>
          <rect x="17" y="82" width="11" height="5" rx="2.5" fill="#FFFFFF"/>
          <rect x="29" y="82" width="11" height="5" rx="2.5" fill="#FFFFFF"/>
          <!-- Bottom Celebration Box (Marigold Gold #EBAA32) -->
          <rect x="28" y="44" width="26" height="16" rx="2.5" fill="#EBAA32" stroke="#38272A" stroke-width="1.3"/>
          <line x1="41" y1="44" x2="41" y2="60" stroke="#BA2848" stroke-width="2.2"/>
          <!-- Top Celebration Box (Warm Ivory #FFF8EF with Crimson Ribbon) -->
          <rect x="30" y="31" width="22" height="13" rx="2" fill="#FFF8EF" stroke="#38272A" stroke-width="1.3"/>
          <line x1="41" y1="31" x2="41" y2="44" stroke="#BA2848" stroke-width="2"/>
          <!-- Arms Holding Boxes -->
          <path d="M22 41L31 49" stroke="#F2C39B" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- 3. Modern 2-Story Home at the Right End with Animated Opening Front Door -->
      <div class="home-actor" aria-hidden="true">
        <svg width="215" height="142" viewBox="0 0 215 142" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ground Shadow -->
          <ellipse cx="108" cy="138" rx="98" ry="4" fill="rgba(56,39,42,0.18)"/>
          <!-- Upper Floor -->
          <rect x="24" y="14" width="166" height="54" rx="3" fill="#FFF8EF" stroke="#38272A" stroke-width="2"/>
          <!-- Upper Roof Overhang -->
          <rect x="16" y="8" width="182" height="7" rx="2" fill="#38272A"/>
          <!-- Upper Windows with Warm Celebration Glow -->
          <rect x="38" y="24" width="46" height="32" rx="2.5" fill="#FDE6A8" stroke="#38272A" stroke-width="1.6"/>
          <line x1="61" y1="24" x2="61" y2="56" stroke="#38272A" stroke-width="1.4"/>
          <rect x="128" y="24" width="48" height="32" rx="2.5" fill="#FDE6A8" stroke="#38272A" stroke-width="1.6"/>
          <line x1="152" y1="24" x2="152" y2="56" stroke="#38272A" stroke-width="1.4"/>
          <!-- Balcony Railing -->
          <line x1="32" y1="56" x2="90" y2="56" stroke="#BA2848" stroke-width="2.5"/>

          <!-- Ground Floor -->
          <rect x="14" y="68" width="186" height="68" rx="3" fill="#F3DFC8" stroke="#38272A" stroke-width="2"/>
          <!-- Crimson Architectural Trim -->
          <rect x="8" y="65" width="198" height="5" rx="1.5" fill="#BA2848"/>

          <!-- Front Entrance Frame & Warm Interior Glow -->
          <rect x="44" y="82" width="38" height="54" rx="2" fill="#FFF3D1" stroke="#38272A" stroke-width="1.8"/>
          <rect class="door-warm-glow" x="45" y="83" width="36" height="52" fill="#EBAA32" opacity="0.45"/>
          <!-- Animated Swinging Front Door -->
          <g transform="translate(45, 83)">
            <g class="house-door-leaf">
              <rect x="0" y="0" width="36" height="52" fill="#7A452E" stroke="#38272A" stroke-width="1.4"/>
              <circle cx="30" cy="27" r="2.2" fill="#EBAA32"/>
            </g>
          </g>
          <!-- Festive Marigold Toran Garland Over Door -->
          <path d="M42 83Q63 93 84 83" stroke="#EBAA32" stroke-width="3.5" stroke-linecap="round" fill="none"/>

          <!-- Ground Floor Living Room Windows -->
          <rect x="104" y="84" width="36" height="28" rx="2.5" fill="#FDE6A8" stroke="#38272A" stroke-width="1.6"/>
          <rect x="150" y="84" width="36" height="28" rx="2.5" fill="#FDE6A8" stroke="#38272A" stroke-width="1.6"/>

          <!-- Crimson Planters & Green Shrubs -->
          <rect x="24" y="123" width="12" height="13" rx="1.5" fill="#BA2848"/>
          <circle cx="30" cy="118" r="7" fill="#4E7A4B"/>
          <rect x="88" y="123" width="12" height="13" rx="1.5" fill="#BA2848"/>
          <circle cx="94" cy="118" r="7" fill="#4E7A4B"/>
        </svg>
      </div>
    </div>

    <div class="footer-bar-bottom">
      <div class="footer-bar-inner">
        <span><strong>RitualEase</strong> • ritualease.com</span>
        <span>Celebrations, delivered at home</span>
      </div>
    </div>
  </footer>

<script src="brain.js?v=13"></script>
<script>
let chatHistory = [];
let isBusy = false;

function initChat() {
  const stream = document.getElementById("chatStream");
  stream.innerHTML = `
    <div class="entry assistant">
      <div class="entry-body">
        <strong>Namaste!</strong> How can I help you today?
        <div class="starter-row">
          <button type="button" class="starter-pill" onclick="useStarter('List all Puja packages and exact offerings in a table')">Puja Offerings Table</button>
          <button type="button" class="starter-pill" onclick="useStarter('Draft a ready-to-send WhatsApp quote for Satyanarayan Katha including customer-owned utensils')">WhatsApp Puja Quote</button>
          <button type="button" class="starter-pill" onclick="useStarter('Summarize recent team updates and flag any missing follow-ups')">Audit Team Logs</button>
        </div>
      </div>
    </div>
  `;
}

function useStarter(text) {
  document.getElementById("qInput").value = text;
  sendMessage();
}

function resetChat() {
  chatHistory = [];
  initChat();
  document.getElementById("qInput").focus();
}

document.getElementById("qInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  if (isBusy) return;
  const input = document.getElementById("qInput");
  const q = input.value.trim();
  if (!q) { input.focus(); return; }

  const scriptUrl = getScriptUrl();
  if (!scriptUrl) {
    appendEntry("assistant", "⚠️ **DEFAULT_SCRIPT_URL** is missing in `brain.js` on GitHub.");
    return;
  }

  input.value = "";
  chatHistory.push({ role: "user", content: q });
  appendEntry("user", q);

  isBusy = true;
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  btn.textContent = "Thinking...";

  const typingId = "typing_" + Date.now();
  appendEntry("assistant", "Thinking...", typingId);

  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({
        action: "chat",
        history: chatHistory
      })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      replaceEntry(typingId, "⚠️ Backend returned HTML instead of JSON. Ensure Apps Script is deployed with **Who has access: Anyone**.");
      isBusy = false;
      btn.disabled = false;
      btn.textContent = "Send ↵";
      return;
    }

    const reply = (data.answer && data.answer.trim()) ? data.answer.trim() : ("⚠️ Unexpected response: " + raw);
    chatHistory.push({ role: "assistant", content: reply });
    replaceEntry(typingId, reply, true);
  } catch (err) {
    replaceEntry(typingId, "⚠️ Network error: " + err.message);
  }

  isBusy = false;
  btn.disabled = false;
  btn.textContent = "Send ↵";
  input.focus();
}

function appendEntry(role, text, id) {
  const stream = document.getElementById("chatStream");
  const entry = document.createElement("div");
  entry.className = "entry " + role;
  if (id) entry.id = id;

  const body = document.createElement("div");
  body.className = "entry-body";
  body.innerHTML = role === "user" ? escapeHtml(text).replace(/\n/g, "<br>") : renderMarkdown(text);
  entry.appendChild(body);

  if (role === "assistant" && !id) {
    entry.appendChild(buildActions(text));
  }

  stream.appendChild(entry);
  stream.scrollTop = stream.scrollHeight;
}

function replaceEntry(id, text, showCopy) {
  const entry = document.getElementById(id);
  if (!entry) return;
  entry.removeAttribute("id");
  const body = entry.querySelector(".entry-body");
  body.innerHTML = renderMarkdown(text);
  if (showCopy) {
    entry.appendChild(buildActions(text));
  }
  const stream = document.getElementById("chatStream");
  stream.scrollTop = stream.scrollHeight;
}

function buildActions(rawText) {
  const bar = document.createElement("div");
  bar.className = "entry-actions";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "copy-btn";
  copyBtn.textContent = "Copy response";
  copyBtn.onclick = function() {
    navigator.clipboard.writeText(rawText);
    copyBtn.textContent = "Copied ✓";
    setTimeout(() => copyBtn.textContent = "Copy response", 1800);
  };
  bar.appendChild(copyBtn);
  return bar;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) continue;

      if (!inTable) {
        html += "<table><thead><tr>" + cells.map(c => "<th>" + inlineFormat(c) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => "<td>" + inlineFormat(c) + "</td>").join("") + "</tr>";
      }
      continue;
    } else if (inTable) {
      html += "</tbody></table>";
      inTable = false;
    }

    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineFormat(line.replace(/^[-*•]\s+/, "")) + "</li>";
      continue;
    } else if (inList) {
      html += "</ul>";
      inList = false;
    }

    if (line.startsWith("### ")) {
      html += "<h4>" + inlineFormat(line.slice(4)) + "</h4>";
    } else if (line.startsWith("## ")) {
      html += "<h3>" + inlineFormat(line.slice(3)) + "</h3>";
    } else if (line.startsWith("# ")) {
      html += "<h2>" + inlineFormat(line.slice(2)) + "</h2>";
    } else if (line === "---") {
      html += "<hr style='border:none;border-top:1px solid #e6d5c3;margin:10px 0;'>";
    } else if (line.length > 0) {
      html += "<p style='margin:6px 0;'>" + inlineFormat(line) + "</p>";
    }
  }

  if (inTable) html += "</tbody></table>";
  if (inList) html += "</ul>";
  return html;
}

function inlineFormat(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code style='background:#f3e6d8;padding:1px 5px;border-radius:4px;'>$1</code>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" style="color:#BA2848;font-weight:600;">Open File ↗</a>');
}

initChat();
</script>
</body>
</html>
