<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask RitualEase Brain — ritualease.com</title>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="accent-strip"></div>
<header>
  <div class="brand-mark">
    <span class="re-seal">RE</span>
    <span class="brand-title">ritualease.com</span>
  </div>
  <div class="brand-sub">RitualEase Intelligence</div>
</header>

<main>
  <div class="surface">
    <h1>Ask RitualEase</h1>
    <p class="lead-text">Ask anything across your Drive folders, spreadsheets, docs, packages, and daily team logs.</p>

    <div class="field">
      <textarea id="qInput" style="min-height:110px;" placeholder="Ask anything... (e.g., How are you? Or: What utensils does a customer need for Satyanarayan Katha? How many pamphlets were distributed this week?)"></textarea>
    </div>

    <button class="btn-primary" id="askBtn" onclick="askBrain()">Ask RitualEase</button>

    <div id="answerArea"></div>
  </div>
</main>

<footer>ritualease.com • Private Brain Query</footer>

<script src="brain.js?v=6"></script>
<script>
document.getElementById("qInput").addEventListener("keydown", function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") askBrain();
});

async function askBrain() {
  const q = document.getElementById("qInput").value.trim();
  if (!q) {
    document.getElementById("qInput").focus();
    return;
  }

  const btn = document.getElementById("askBtn");
  const area = document.getElementById("answerArea");
  const scriptUrl = getScriptUrl();

  if (!scriptUrl) {
    area.innerHTML = `<div class="response-card">⚠️ <strong>DEFAULT_SCRIPT_URL</strong> is still empty inside <strong>brain.js</strong> on GitHub.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Thinking across your Drive & Brain...";
  area.innerHTML = `<div class="response-card" style="color:var(--muted);">Reading your sheets, docs, and team logs...</div>`;

  try {
    const url = scriptUrl + (scriptUrl.includes("?") ? "&" : "?") + "q=" + encodeURIComponent(q);
    const res = await fetch(url);
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      area.innerHTML = `<div class="response-card">⚠️ Apps Script returned a login/HTML page instead of JSON. Open Apps Script → Deploy → Manage deployments → Edit (✏️) and set <strong>Who has access: Anyone</strong>.</div>`;
      btn.disabled = false;
      btn.textContent = "Ask RitualEase";
      return;
    }

    if (data.answer) {
      area.innerHTML = `<div class="response-card">${formatAnswer(data.answer)}</div>`;
    } else {
      area.innerHTML = `<div class="response-card">⚠️ Unexpected response: ${raw}</div>`;
    }
  } catch (err) {
    area.innerHTML = `<div class="response-card">⚠️ Connection error: ${err.message}. Check that Apps Script is deployed as <strong>Who has access: Anyone</strong>.</div>`;
  }

  btn.disabled = false;
  btn.textContent = "Ask RitualEase";
}

function formatAnswer(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" style="color:var(--crimson);font-weight:600;">Open Drive File ↗</a>');
}
</script>
</body>
</html>
