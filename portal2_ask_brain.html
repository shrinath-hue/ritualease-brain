<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask RitualEase Brain — ritualease.com</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="accent-strip"></div>
<header>
  <div class="brand-mark">
    <span class="re-seal">RE</span>
    <span class="brand-title">ritualease.com</span>
  </div>
  <div class="brand-sub">RitualEase Intelligence</div>
</header>

<main>
  <div class="surface">
    <h1>Ask RitualEase</h1>
    <p class="lead-text">Ask anything across your Drive folders, spreadsheets, docs, packages, and daily team logs.</p>

    <div class="field">
      <textarea id="qInput" style="min-height:110px;" placeholder="Type your question here... (e.g., How many pamphlets were distributed this week? Which leads need follow-up? What are the Satyanarayan Katha utensil rules?)"></textarea>
    </div>

    <button class="btn-primary" id="askBtn" onclick="askBrain()">Ask RitualEase</button>

    <div id="answerArea"></div>
  </div>
</main>

<footer>ritualease.com • Private Brain Query</footer>

<script src="brain.js"></script>
<script>
document.getElementById("qInput").addEventListener("keydown", function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") askBrain();
});

async function askBrain() {
  const q = document.getElementById("qInput").value.trim();
  if (!q) {
    document.getElementById("qInput").focus();
    return;
  }

  const btn = document.getElementById("askBtn");
  const area = document.getElementById("answerArea");
  btn.disabled = true;
  btn.textContent = "Thinking across your Drive & Brain...";
  area.innerHTML = `<div class="response-card" style="color:var(--muted);">Reading your sheets, docs, images, and team logs...</div>`;

  const scriptUrl = getScriptUrl();

  // 1. Live Google Apps Script + Gemini AI + Drive Folder Search
  if (scriptUrl) {
    try {
      const url = scriptUrl + (scriptUrl.includes("?") ? "&" : "?") + "q=" + encodeURIComponent(q);
      const res = await fetch(url);
      const data = await res.json();
      if (data.answer) {
        area.innerHTML = `<div class="response-card">${formatAnswer(data.answer)}</div>`;
        btn.disabled = false;
        btn.textContent = "Ask RitualEase";
        return;
      }
    } catch (err) {
      // Fallback smoothly to local logs if offline
    }
  }

  // 2. Fallback search if Apps Script URL is not yet added in brain.js
  const logs = getEntries();
  const terms = q.toLowerCase().split(/\W+/).filter(w => w.length > 2);
  const matches = logs.filter(l => {
    const blob = `${l.name} ${l.splitSummary} ${l.rawText} ${(l.fileNames||[]).join(" ")}`.toLowerCase();
    return terms.some(t => blob.includes(t));
  });

  if (matches.length) {
    const summary = matches.map(m => `• ${m.name} (${m.time}): ${m.splitSummary || m.rawText}`).join("\n");
    area.innerHTML = `<div class="response-card">${formatAnswer(summary)}</div>`;
  } else {
    area.innerHTML = `<div class="response-card">No matching records found yet. Make sure your Google Apps Script URL is added to <strong>brain.js</strong> so I can read your full Drive folder and Google Sheets.</div>`;
  }

  btn.disabled = false;
  btn.textContent = "Ask RitualEase";
}

function formatAnswer(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" style="color:var(--crimson);font-weight:600;">Open Drive File ↗</a>');
}
</script>
</body>
</html>
